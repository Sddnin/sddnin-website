<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashcard Hàn - Học & Chơi Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-blue: #4a90e2; --shadow: 0 10px 20px rgba(0,0,0,0.1); }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; background: #f8f9fa; padding: 15px; }
        .header { width: 100%; max-width: 600px; text-align: center; margin: 15px 0; font-size: 22px; font-weight: 600; color: var(--primary-blue); display: flex; justify-content: center; align-items: center; gap: 15px; }
        
        .mode-switch { padding: 6px 15px; border: 2px solid var(--primary-blue); background: white; color: var(--primary-blue); border-radius: 20px; cursor: pointer; font-weight: 600; transition: 0.2s; font-size: 14px;}
        .mode-switch.active { background: var(--primary-blue); color: white; }

        .config-section { width: 100%; max-width: 600px; display: flex; gap: 8px; margin-bottom: 15px; }
        .config-section input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 14px;}
        .config-section button { background: var(--primary-blue); color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; }

        /* === CHẾ ĐỘ HỌC === */
        #study-section { display: flex; flex-direction: column; align-items: center; width: 100%; }
        .card-wrapper { perspective: 1000px; width: 100%; max-width: 380px; height: 220px; margin-bottom: 20px; position: relative; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s; cursor: pointer; border-radius: 15px; box-shadow: var(--shadow); }
        .card.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(145deg, #5da0f4, #4a90e2); color: white; padding: 20px; text-align: center; }
        .card-back { transform: rotateY(180deg); background: #ffffff; color: #333; border: 1px solid #eee; }
        .korean { font-size: 30px; font-weight: 600; margin-bottom: 5px; }
        .vietnamese { font-size: 24px; font-weight: 500; color: var(--primary-blue); }
        .roman { font-size: 14px; color: rgba(255,255,255,0.85); }
        .card-back .roman { color: #888; }
        .flip-icon { margin-top: 15px; font-size: 13px; background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 15px; }
        
        .controls { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
        .controls button { padding: 8px 20px; border: 1px solid var(--primary-blue); background: white; color: var(--primary-blue); border-radius: 20px; cursor: pointer; }
        
        .action-buttons { display: flex; gap: 10px; margin-bottom: 10px; justify-content: center; flex-wrap: wrap; }
        .action-buttons button { padding: 8px 18px; border: none; border-radius: 20px; cursor: pointer; color: white; font-weight: bold; font-size: 14px;}
        .btn-speak { background: #e67e22; }
        .btn-practice { background: #27ae60; }
        .btn-ai { background: #9b59b6; }
        #ai-result, #speech-result { display: none; width: 100%; max-width: 500px; background: white; padding: 15px; border-radius: 15px; box-shadow: var(--shadow); margin-bottom: 15px; white-space: pre-wrap; line-height: 1.6; font-size: 14px;}
        #speech-result { text-align: center; }
        
        .progress-container { width: 100%; max-width: 250px; text-align: center; font-size: 13px; color: #777; margin-top: 10px; }
        .progress-bar { width: 100%; height: 5px; background: #e9ecef; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary-blue); transition: width 0.3s; }

        /* === CHẾ ĐỘ CHƠI (GAME LẬT BÀI) === */
        #game-section { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 500px; }
        .game-header { width: 100%; display: flex; justify-content: space-between; padding: 10px 15px; background: white; border-radius: 15px; box-shadow: var(--shadow); margin-bottom: 15px; font-weight: bold; color: #555; font-size: 15px; }
        
        .game-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; width: 100%; max-width: 450px; margin-bottom: 15px; }
        @media (max-width: 500px) { .game-board { grid-template-columns: repeat(3, 1fr); gap: 8px; } }

        .game-card { aspect-ratio: 1 / 1; perspective: 600px; cursor: pointer; position: relative; }
        .game-card .front, .game-card .back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: transform 0.4s; padding: 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .game-card .front { background: #ff9800; color: white; font-size: 28px; transform: rotateY(0deg); }
        .game-card .back { background: white; color: #333; border: 1px solid #ddd; transform: rotateY(180deg); font-size: 14px; word-break: keep-all; text-align: center; }
        
        .game-card.flipped .front { transform: rotateY(180deg); }
        .game-card.flipped .back { transform: rotateY(0deg); }
        .game-card.matched { cursor: default; }
        .game-card.matched .front { background: #2ecc71; transform: rotateY(180deg); }
        .game-card.matched .back { background: #2ecc71; color: white; border: none; transform: rotateY(0deg); }
        
        .reset-game-btn { background: #e74c3c; color: white; border: none; padding: 10px 25px; border-radius: 20px; cursor: pointer; font-weight: bold; }
    </style>
    
    <!-- Load Gemini SDK -->
    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://cdn.jsdelivr.net/npm/@google/generative-ai@0.21.0/dist/index.js" } }
    </script>
</head>
<body>

    <div class="header">
        📚 Học Tiếng Hàn
        <button class="mode-switch" id="mode-switch-btn" onclick="toggleMode()"><i class="fas fa-gamepad"></i> Chơi Game</button>
    </div>

    <div class="config-section">
        <input type="text" id="api-key-input" placeholder="Gemini API Key (để dùng AI giải thích)...">
        <button onclick="saveAPIKey()">Lưu Key</button>
    </div>

    <!-- === PHẦN CHẾ ĐỘ HỌC === -->
    <div id="study-section">
        <div class="card-wrapper">
            <div class="card" id="flashcard">
                <div class="card-face card-front">
                    <div class="korean" id="front-text">안녕하세요</div>
                    <div class="roman" id="front-roman">annyeonghaseyo</div>
                    <div class="flip-icon"><i class="fas fa-sync-alt"></i> Lật xem nghĩa</div>
                </div>
                <div class="card-face card-back">
                    <div class="vietnamese" id="back-text">Xin chào</div>
                    <div class="roman" id="back-roman">annyeonghaseyo</div>
                    <div class="flip-icon" style="background:#f0f0f0; color:#555;"><i class="fas fa-sync-alt"></i> Lật lại</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button onclick="prevCard()">◀ Trước</button>
            <button onclick="nextCard()">Sau ▶</button>
        </div>

        <div class="action-buttons">
            <button class="btn-speak" onclick="playAudio()"><i class="fas fa-volume-up"></i> Nghe phát âm</button>
            <button class="btn-practice" onclick="practiceSpeaking()"><i class="fas fa-microphone"></i> Luyện nói</button>
            <button class="btn-ai" onclick="askAIContext()"><i class="fas fa-robot"></i> Hỏi AI giải thích</button>
        </div>

        <div id="speech-result"></div>
        <div id="ai-result"></div>

        <div class="progress-container">
            <span id="current-idx">1</span> / <span id="total-idx">60</span>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
    </div>

    <!-- === PHẦN CHẾ ĐỘ CHƠI (GAME) === -->
    <div id="game-section">
        <div class="game-header">
            <span><i class="fas fa-clock"></i> Lượt: <span id="game-attempts">0</span></span>
            <span><i class="fas fa-check-circle"></i> Cặp: <span id="game-matches">0</span>/6</span>
        </div>
        <div class="game-board" id="game-board"></div>
        <button class="reset-game-btn" onclick="startNewGame()"><i class="fas fa-redo-alt"></i> Chơi lại</button>
    </div>

    <!-- === PHẦN LOGIC JAVASCRIPT (Dùng Module) === -->
    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // 1. Dữ liệu từ vựng
        const flashcards = [
            { front: "안녕하세요", roman: "annyeonghaseyo", back: "Xin chào" },
            { front: "감사합니다", roman: "gamsahamnida", back: "Cảm ơn" },
            { front: "죄송합니다", roman: "joesonghamnida", back: "Xin lỗi" },
            { front: "사랑해요", roman: "saranghaeyo", back: "Tôi yêu bạn" },
            { front: "안녕", roman: "annyeong", back: "Chào (thân mật)" },
            { front: "괜찮아요", roman: "gwaenchanayo", back: "Không sao" },
            { front: "맛있어요", roman: "masisseoyo", back: "Ngon quá" },
            { front: "네", roman: "ne", back: "Vâng / Đúng" },
            { front: "아니요", roman: "aniyo", back: "Không" },
            { front: "좋아요", roman: "johayo", back: "Thích / Tốt" },
            { front: "어서 오세요", roman: "eoseo oseyo", back: "Xin mời vào" },
            { front: "잠시만요", roman: "jamsimanyo", back: "Chờ một chút" },
            { front: "도와주세요", roman: "dowajuseyo", back: "Xin hãy giúp tôi" },
            { front: "미안해요", roman: "mianhaeyo", back: "Xin lỗi (nhẹ)" },
            { front: "오늘", roman: "oneul", back: "Hôm nay" },
            { front: "내일", roman: "naeil", back: "Ngày mai" },
            { front: "어제", roman: "eoje", back: "Hôm qua" },
            { front: "그럼", roman: "geureom", back: "Vậy thì" },
            { front: "맞아요", roman: "majayo", back: "Đúng vậy" },
            { front: "아니에요", roman: "anieyo", back: "Không phải đâu" },
            { front: "물", roman: "mul", back: "Nước" },
            { front: "밥", roman: "bap", back: "Cơm" },
            { front: "친구", roman: "chingu", back: "Bạn bè" },
            { front: "가족", roman: "gajok", back: "Gia đình" },
            { front: "사람", roman: "saram", back: "Người" },
        ];

        // === CHẾ ĐỘ HỌC ===
        let currentIndex = 0;
        const card = document.getElementById('flashcard');
        const frontText = document.getElementById('front-text');
        const backText = document.getElementById('back-text');
        const frontRoman = document.getElementById('front-roman');
        const backRoman = document.getElementById('back-roman');
        const currentIdxSpan = document.getElementById('current-idx');
        const totalIdxSpan = document.getElementById('total-idx');
        const progressFill = document.getElementById('progress-fill');

        function updateCard() {
            card.classList.remove('is-flipped');
            const c = flashcards[currentIndex];
            frontText.innerText = c.front;
            backText.innerText = c.back;
            frontRoman.innerText = c.roman;
            backRoman.innerText = c.roman;
            currentIdxSpan.innerText = currentIndex + 1;
            totalIdxSpan.innerText = flashcards.length;
            progressFill.style.width = ((currentIndex + 1) / flashcards.length) * 100 + '%';
            document.getElementById('ai-result').style.display = 'none';
            document.getElementById('speech-result').style.display = 'none';
        }
        card.onclick = () => card.classList.toggle('is-flipped');

        window.prevCard = function() { if (currentIndex > 0) { currentIndex--; updateCard(); } }
        window.nextCard = function() { if (currentIndex < flashcards.length - 1) { currentIndex++; updateCard(); } }

        window.playAudio = function() {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                const text = flashcards[currentIndex].front;
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR'; utterance.rate = 0.75;
                window.speechSynthesis.speak(utterance);
            }
        }

        window.practiceSpeaking = function() {
            const targetWord = flashcards[currentIndex].front;
            const resultDiv = document.getElementById('speech-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Đang nghe... Đọc từ này vào micro!`;
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                return resultDiv.innerHTML = "❌ Dùng Chrome trên PC để xài tính năng này.";
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'ko-KR';
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript.trim();
                if (transcript.replace(/\s/g, '') === targetWord.replace(/\s/g, '')) {
                    resultDiv.innerHTML = `<span style="color:#27ae60; font-size:18px;">🎉 Tuyệt vời!</span><br><br>Máy nghe bạn nói: <b>${transcript}</b>`;
                } else {
                    resultDiv.innerHTML = `<span style="color:#e74c3c;">😅 Chưa chuẩn!<br><br>Máy nghe: <b>${transcript}</b><br>Cần đọc: <b>${targetWord}</b></span>`;
                }
            };
            recognition.start();
        }

        const savedKey = localStorage.getItem('gemini_api_key');
        if(savedKey) document.getElementById('api-key-input').value = savedKey;
        window.saveAPIKey = function() {
            const key = document.getElementById('api-key-input').value.trim();
            if(key) { localStorage.setItem('gemini_api_key', key); alert("Đã lưu Key Gemini!"); }
        }

        window.askAIContext = async function() {
            const apiKey = localStorage.getItem('gemini_api_key');
            if(!apiKey) return alert("Chưa có API Key Gemini!");
            const resultDiv = document.getElementById('ai-result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div style="text-align:center"><i class="fas fa-circle-notch fa-spin"></i> AI đang phân tích...</div>';
            try {
                const genAI = new GoogleGenerativeAI(apiKey);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
                const c = flashcards[currentIndex];
                const prompt = `Hãy giải thích từ vựng tiếng Hàn này cho người Việt học: Từ: "${c.front}" (Phiên âm: ${c.roman}) Nghĩa: "${c.back}". Cho biết thêm 2 ví dụ đặt câu bằng tiếng Hàn kèm dịch tiếng Việt. Viết ngắn gọn.`;
                const result = await model.generateContent(prompt);
                const response = await result.response;
                resultDiv.innerHTML = response.text().replace(/\n/g, '<br>');
            } catch (e) {
                resultDiv.innerHTML = `<span style="color:red">Lỗi AI: Sai API Key hoặc hết hạn!</span>`;
            }
        }

        // === CHẾ ĐỘ GAME LẬT BÀI (Đã viết lại) ===
        window.toggleMode = function() {
            const btn = document.getElementById('mode-switch-btn');
            const study = document.getElementById('study-section');
            const game = document.getElementById('game-section');

            if (study.style.display === 'none') {
                study.style.display = 'flex';
                game.style.display = 'none';
                btn.innerHTML = '<i class="fas fa-gamepad"></i> Chơi Game';
                btn.classList.remove('active');
                updateCard();
            } else {
                study.style.display = 'none';
                game.style.display = 'flex';
                btn.innerHTML = '<i class="fas fa-book"></i> Học bài';
                btn.classList.add('active');
                startNewGame(); 
            }
        }

        let gameCardsData = [];
        let firstCard = null, secondCard = null, lockBoard = false, matches = 0, attempts = 0;

        function shuffle(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } return array; }

        window.startNewGame = function() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            matches = 0; attempts = 0;
            document.getElementById('game-matches').innerText = '0';
            document.getElementById('game-attempts').innerText = '0';
            firstCard = null; secondCard = null; lockBoard = false;

            const shuffledVocab = shuffle([...flashcards]).slice(0, 6);
            let cardData = [];
            shuffledVocab.forEach((word, index) => {
                cardData.push({ id: index, front: word.front, back: '?' });
                cardData.push({ id: index, front: word.back, back: '?' });
            });
            shuffle(cardData);
            gameCardsData = cardData;

            // Dùng HTML có sẵn front/back để khỏi dùng textContent trong JS
            cardData.forEach((data) => {
                const cardEl = document.createElement('div');
                cardEl.classList.add('game-card');
                cardEl.dataset.id = data.id;
                cardEl.innerHTML = `
                    <div class="front">❓</div>
                    <div class="back">${data.front}</div>
                `;
                cardEl.addEventListener('click', flipGameCard);
                board.appendChild(cardEl);
            });
        }

        function flipGameCard() {
            if (lockBoard) return;
            if (this.classList.contains('flipped') || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            if (!firstCard) {
                firstCard = this;
                return;
            }
            
            secondCard = this;
            attempts++;
            document.getElementById('game-attempts').innerText = attempts;
            checkForMatch();
        }

        function checkForMatch() {
            let isMatch = firstCard.dataset.id === secondCard.dataset.id;
            isMatch ? disableCards() : unflipCards();
        }

        function disableCards() {
            firstCard.classList.add('matched');
            secondCard.classList.add('matched');
            matches++;
            document.getElementById('game-matches').innerText = matches;
            resetBoard();
            if (matches === 6) {
                setTimeout(() => alert(`🎉 Bạn đã thắng sau ${attempts} lượt! Tài quá!`), 300);
            }
        }

        function unflipCards() {
            lockBoard = true;
            setTimeout(() => {
                firstCard.classList.remove('flipped');
                secondCard.classList.remove('flipped');
                resetBoard();
            }, 800);
        }

        function resetBoard() { firstCard = null; secondCard = null; lockBoard = false; }

        updateCard();
    </script>
</body>
</html>
