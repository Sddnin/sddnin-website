<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ứng Dụng Luyện Nói Tiếng Anh</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .app-card {
      background: #ffffff;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      width: 100%;
    }

    .progress-bar {
      height: 6px;
      background: #e9ecef;
      border-radius: 3px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #0d6efd;
      width: 20%;
      transition: width 0.3s ease;
    }

    .header-info {
      display: flex;
      justify-content: space-between;
      color: #6c757d;
      font-size: 14px;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .practice-box {
      text-align: center;
      margin-bottom: 24px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 1px solid #e9ecef;
    }

    .target-sentence {
      font-size: 22px;
      font-weight: 700;
      color: #212529;
      margin-bottom: 8px;
    }

    .translation {
      font-size: 15px;
      color: #6c757d;
      margin-bottom: 12px;
    }

    .audio-btn {
      background: none;
      border: none;
      color: #0d6efd;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .action-area {
      text-align: center;
      margin-bottom: 20px;
    }

    .mic-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: none;
      background: #0d6efd;
      color: white;
      font-size: 28px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
    }

    .mic-btn.recording {
      background: #dc3545;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.6); }
      70% { box-shadow: 0 0 0 16px rgba(220, 53, 69, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
    }

    .status-text {
      font-size: 14px;
      color: #6c757d;
      margin-top: 10px;
    }

    .result-card {
      padding: 16px;
      border-radius: 12px;
      background: #f1f3f5;
      display: none;
      margin-bottom: 20px;
    }

    .score-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .spoken-text {
      font-size: 14px;
      color: #495057;
    }

    .nav-btns {
      display: flex;
      gap: 12px;
    }

    .nav-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      background: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.primary {
      background: #0d6efd;
      color: white;
      border: none;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="header-info">
      <span>Bài luyện nói</span>
      <span id="counter">Câu 1/5</span>
    </div>

    <!-- Khối câu hỏi -->
    <div class="practice-box">
      <div class="target-sentence" id="targetText">How are you doing today?</div>
      <div class="translation" id="translationText">Hôm nay bạn thế nào?</div>
      <button class="audio-btn" onclick="playStandardAudio()">🔊 Nghe phát âm mẫu</button>
    </div>

    <!-- Khối thao tác thu âm -->
    <div class="action-area">
      <button class="mic-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
      <div class="status-text" id="statusText">Bấm micro và đọc to câu trên</div>
    </div>

    <!-- Khối kết quả chấm điểm -->
    <div class="result-card" id="resultCard">
      <div class="score-title" id="scoreTitle">Kết quả: 0%</div>
      <div class="spoken-text">Bạn đã nói: <i id="spokenText">-</i></div>
    </div>

    <!-- Nút điều hướng -->
    <div class="nav-btns">
      <button class="nav-btn" onclick="prevSentence()">Câu trước</button>
      <button class="nav-btn primary" onclick="nextSentence()">Câu tiếp theo</button>
    </div>
  </div>

  <script>
    // Danh sách câu luyện nói
    const practiceList = [
      { en: "How are you doing today?", vi: "Hôm nay bạn thế nào?" },
      { en: "Nice to meet you.", vi: "Rất vui được gặp bạn." },
      { en: "Where are you from?", vi: "Bạn đến từ đâu?" },
      { en: "Can you help me, please?", vi: "Bạn có thể giúp tôi được không?" },
      { en: "Have a great day!", vi: "Chúc bạn một ngày tuyệt vời!" }
    ];

    let currentIndex = 0;
    let recognition = null;
    let isRecording = false;

    // Khởi tạo Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
        document.getElementById('statusText').innerText = "Đang nghe... Nói ngay nhé!";
      };

      recognition.onresult = (event) => {
        const spoken = event.results[0][0].transcript;
        evaluateSpeaking(spoken, practiceList[currentIndex].en);
      };

      recognition.onerror = () => {
        resetMic();
        document.getElementById('statusText').innerText = "Chưa nghe rõ, hãy thử lại!";
      };

      recognition.onend = () => {
        resetMic();
      };
    } else {
      document.getElementById('statusText').innerText = "Trình duyệt không hỗ trợ Mic. Hãy dùng Chrome/Edge.";
    }

    function toggleRecording() {
      if (!recognition) return;
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function resetMic() {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
    }

    // Đánh giá phát âm câu
    function evaluateSpeaking(spoken, target) {
      const score = calculateSimilarity(spoken, target);
      const resultCard = document.getElementById('resultCard');
      const scoreTitle = document.getElementById('scoreTitle');
      const spokenText = document.getElementById('spokenText');

      resultCard.style.display = 'block';
      spokenText.innerText = `"${spoken}"`;
      
      if (score >= 80) {
        scoreTitle.innerText = `Xuất sắc! (${score}%)`;
        scoreTitle.style.color = "#0f5132";
      } else if (score >= 50) {
        scoreTitle.innerText = `Khá tốt! (${score}%)`;
        scoreTitle.style.color = "#664d03";
      } else {
        scoreTitle.innerText = `Thử lại nhé! (${score}%)`;
        scoreTitle.style.color = "#842029";
      }

      document.getElementById('statusText').innerText = "Đã hoàn thành!";
    }

    // Thuật toán so sánh độ chính xác phát âm câu
    function calculateSimilarity(str1, str2) {
      const s1 = str1.toLowerCase().replace(/[^\w\s]/gi, '').trim();
      const s2 = str2.toLowerCase().replace(/[^\w\s]/gi, '').trim();
      if (s1 === s2) return 100;

      const words1 = s1.split(/\s+/);
      const words2 = s2.split(/\s+/);
      let matches = 0;

      words1.forEach(word => {
        if (words2.includes(word)) matches++;
      });

      return Math.round((matches / Math.max(words1.length, words2.length)) * 100);
    }

    // Đọc mẫu
    function playStandardAudio() {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(practiceList[currentIndex].en);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    // Chuyển câu
    function updateCard() {
      const item = practiceList[currentIndex];
      document.getElementById('targetText').innerText = item.en;
      document.getElementById('translationText').innerText = item.vi;
      document.getElementById('counter').innerText = `Câu ${currentIndex + 1}/${practiceList.length}`;
      document.getElementById('progressFill').style.width = `${((currentIndex + 1) / practiceList.length) * 100}%`;
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('statusText').innerText = "Bấm micro và đọc to câu trên";
    }

    function nextSentence() {
      if (currentIndex < practiceList.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function prevSentence() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }
  </script>
</body>
</html>
