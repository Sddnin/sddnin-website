<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duolingo — The free, fun, effective way to learn a language</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/@fontsource-variable/nunito@latest/index.css" rel="stylesheet">
<style>
:root{
  --green:#58cc02; --green-d:#46a302; --green-bg:#d7ffb8; --green-t:#58a700;
  --blue:#1cb0f6; --blue-d:#1899d6; --blue-bg:#ddf4ff; --blue-t:#1899d6;
  --red:#ff4b4b; --red-d:#ea2b2b; --red-bg:#ffdfe0;
  --gold:#ffc800; --gold-d:#d9a900;
  --purple:#ce82ff; --purple-d:#a568cc;
  --text:#4b4b4b; --head:#3c3c3c; --gray:#afafaf; --border:#e5e5e5; --bg:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Nunito Variable',Nunito,sans-serif;color:var(--text);background:var(--bg);font-size:15px}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
h1,h2,h3{color:var(--head)}
.hidden{display:none!important}
svg{display:block}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;font-size:15px;border-radius:16px;padding:12px 24px;transition:filter .15s,transform .05s;user-select:none}
.btn:active{transform:translateY(4px);box-shadow:none!important}
.btn-green{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn-green:hover{filter:brightness(1.06)}
.btn-blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.btn-blue:hover{filter:brightness(1.06)}
.btn-red{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.btn-red:hover{filter:brightness(1.06)}
.btn-white{background:#fff;color:var(--blue-t);border:2px solid var(--border);box-shadow:0 4px 0 var(--border)}
.btn-white:hover{background:#f7f7f7}
.btn-gold{background:var(--gold);color:#fff;box-shadow:0 4px 0 var(--gold-d)}
.btn-disabled{background:var(--border);color:var(--gray);pointer-events:none}
.btn.big{width:100%;padding:15px}
.btn.sm{padding:8px 16px;font-size:13px;border-radius:12px}

/* ============ SIDEBAR ============ */
#sidebar{position:fixed;left:0;top:0;bottom:0;width:240px;border-right:2px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:8px;z-index:50;background:#fff}
#logo{font-size:28px;font-weight:900;color:var(--green);letter-spacing:-1px;padding:6px 12px 18px;text-transform:lowercase}
.nav-item{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:14px;border:2px solid transparent;color:#777;font-weight:800;font-size:14px;letter-spacing:.8px;text-transform:uppercase;transition:background .15s}
.nav-item svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:#f2f2f2}
.nav-item.active{background:var(--blue-bg);border-color:#84d8ff;color:var(--blue)}

/* ============ MAIN / TOPBAR ============ */
#main{margin-left:240px;min-height:100vh}
#topbar{position:sticky;top:0;background:#fff;z-index:40;border-bottom:2px solid transparent}
#topbar .tb-in{max-width:1020px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:12px}
.tb-item{display:flex;align-items:center;gap:7px;font-weight:800;font-size:16px;cursor:pointer;padding:4px 6px;border-radius:10px}
.tb-item:hover{background:#f2f2f2}
.tb-flag{font-size:22px;line-height:1}
.tb-streak{color:#ff9600}.tb-gems{color:var(--blue)}.tb-hearts{color:var(--red)}
.tb-ico{font-size:20px}

/* ============ PAGES ============ */
.page{display:none;max-width:1020px;margin:0 auto;padding:16px 24px 120px}
.page.active{display:block}
.home-grid{display:flex;gap:32px;justify-content:center;align-items:flex-start}
#path{flex:1;max-width:600px;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:8px}

/* unit banner */
.unit-banner{width:100%;border-radius:16px;padding:18px 22px;color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.18);margin:26px 0 30px}
.unit-banner .ub-l small{display:block;font-size:13px;font-weight:800;letter-spacing:1px;opacity:.85;text-transform:uppercase}
.unit-banner .ub-l h2{color:#fff;font-size:20px;font-weight:800;margin:2px 0}
.unit-banner .ub-l p{font-size:14px;opacity:.9;font-weight:600}
.ub-book{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;transition:background .15s}
.ub-book:hover{background:rgba(255,255,255,.32)}
.unit-locked .unit-banner{filter:grayscale(.9);opacity:.65}

/* nodes */
.node-wrap{position:relative;margin:14px 0}
.node{width:72px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;transition:transform .1s,filter .15s}
.node svg{width:34px;height:34px;fill:#fff}
.node:hover{filter:brightness(1.07)}
.node:active{transform:translateY(4px)}
.node.active-n{background:var(--green);box-shadow:0 8px 0 var(--green-d)}
.node.done-n{background:var(--gold);box-shadow:0 8px 0 var(--gold-d)}
.node.locked-n{background:var(--border);box-shadow:0 8px 0 #cfcfcf;cursor:not-allowed}
.node.locked-n svg{fill:var(--gray)}
.node.chest{background:var(--gold);box-shadow:0 8px 0 var(--gold-d);font-size:30px}
.node.chest.opened{background:var(--border);box-shadow:0 8px 0 #cfcfcf;filter:grayscale(1)}
.node.chest.locked-n{background:var(--border);box-shadow:0 8px 0 #cfcfcf;filter:grayscale(1)}
.ring{position:absolute;inset:-9px;border:4px solid var(--green);border-radius:50%;animation:pulse 1.6s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{transform:scale(.85);opacity:.9}70%{transform:scale(1.15);opacity:0}100%{opacity:0}}
.start-bubble{position:absolute;bottom:calc(100% + 16px);left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--border);border-radius:12px;padding:6px 18px;color:var(--green);font-weight:900;letter-spacing:1px;font-size:14px;animation:bob 1.4s ease-in-out infinite;white-space:nowrap;z-index:5}
.start-bubble:after{content:'';position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;filter:drop-shadow(0 2px 0 var(--border))}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-6px)}}

/* ============ RIGHT RAIL ============ */
#rail{width:350px;flex-shrink:0;display:flex;flex-direction:column;gap:20px;position:sticky;top:80px}
.card{border:2px solid var(--border);border-radius:16px;padding:20px;background:#fff}
.card h3{font-size:18px;font-weight:800;margin-bottom:4px}
.card .sub{color:#777;font-weight:600;font-size:14px;margin-bottom:14px}
.rail-flex{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.rail-flex .big-ico{font-size:40px}
.q-mini{display:flex;align-items:center;gap:10px;margin:12px 0}
.q-mini .qi{font-size:22px}
.q-mini .qt{flex:1}
.q-mini .qt b{display:block;font-size:14px;color:var(--head)}
.pbar{height:12px;background:var(--border);border-radius:8px;overflow:hidden;margin-top:5px}
.pbar i{display:block;height:100%;background:var(--green);border-radius:8px;position:relative;transition:width .4s}
.pbar i:after{content:'';position:absolute;right:6px;top:3px;height:4px;width:14px;background:rgba(255,255,255,.4);border-radius:4px}
.q-mini .qn{font-weight:800;color:#777;font-size:13px;white-space:nowrap}
.super-card{background:linear-gradient(135deg,#7a4dff,#b869ff);border:none;color:#fff}
.super-card h3{color:#fff}
.super-card p{font-weight:600;font-size:14px;margin-bottom:14px;opacity:.95}

/* ============ LEADERBOARD ============ */
.lb-wrap{max-width:620px;margin:0 auto}
.lb-head{text-align:center;padding:26px 0 10px}
.lb-head .cup{font-size:64px}
.lb-head h1{font-size:26px;font-weight:900;margin:8px 0 2px}
.lb-head p{color:#777;font-weight:700}
.lb-head .ends{display:inline-block;margin-top:10px;background:#f7f7f7;border-radius:12px;padding:6px 14px;font-weight:800;color:#777;font-size:13px}
.lb-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;font-weight:700}
.lb-row .rank{width:26px;text-align:center;font-weight:800;color:#777}
.lb-row .ava{width:44px;height:44px;border-radius:50%;background:#f2f2f2;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid var(--border)}
.lb-row .nm{flex:1;font-weight:800;color:var(--head)}
.lb-row .xp{color:#777;font-weight:700}
.lb-row.zone-up{background:#eafbe0}.lb-row.zone-up .rank{color:var(--green)}
.lb-row.zone-dn{background:#fff0f0}.lb-row.zone-dn .rank{color:var(--red)}
.lb-row.me{border:2px solid #84d8ff;background:var(--blue-bg)}
.lb-div{display:flex;align-items:center;gap:10px;margin:10px 4px;color:var(--green);font-weight:800;font-size:13px;letter-spacing:.5px}
.lb-div.dn{color:var(--red)}
.lb-div:before,.lb-div:after{content:'';flex:1;height:2px;background:var(--border)}

/* ============ QUESTS PAGE ============ */
.quest-card{display:flex;align-items:center;gap:16px;border:2px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.quest-card .qi{font-size:34px}
.quest-card .qt{flex:1}
.quest-card .qt b{color:var(--head);font-size:16px}
.quest-card .qt .pbar{margin-top:8px}
.page-title{font-size:24px;font-weight:900;margin:18px 0 16px;display:flex;align-items:center;gap:10px}

/* ============ SHOP ============ */
.shop-gems{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--blue);font-size:18px}
.shop-sec{font-size:18px;font-weight:900;color:var(--head);margin:26px 0 12px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.shop-item{border:2px solid var(--border);border-radius:16px;padding:18px;text-align:center;background:#fff}
.shop-item .si{font-size:46px;margin-bottom:8px}
.shop-item b{color:var(--head);font-size:16px}
.shop-item p{color:#777;font-weight:600;font-size:13px;margin:6px 0 12px;min-height:34px}
.price-btn{background:var(--blue-bg);color:var(--blue-t);font-weight:800;border-radius:12px;padding:8px 18px;display:inline-flex;gap:6px;align-items:center;transition:filter .15s}
.price-btn:hover{filter:brightness(.96)}
.price-btn:disabled{background:#f2f2f2;color:var(--gray);cursor:not-allowed}

/* ============ PROFILE ============ */
.prof-head{display:flex;align-items:center;gap:22px;padding:20px 0}
.prof-head img{width:96px;height:96px;border-radius:50%;border:4px solid var(--green);object-fit:cover;background:#fff}
.prof-head h1{font-size:26px;font-weight:900}
.prof-head p{color:#777;font-weight:700}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.stat-box{border:2px solid var(--border);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;font-weight:800;color:var(--head)}
.stat-box .sbi{font-size:28px}
.stat-box small{display:block;color:#777;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.ach{display:flex;gap:14px;align-items:center;border:2px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.ach .ai{font-size:34px;filter:grayscale(.2)}
.ach .at{flex:1}
.ach .at b{color:var(--head)}
.ach .at small{display:block;color:#777;font-weight:600}
.reset-link{margin:30px 0 10px;color:var(--gray);font-weight:700;font-size:13px;text-decoration:underline}

/* ============ LESSON OVERLAY ============ */
#overlay{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column}
#lesson-top{max-width:900px;width:100%;margin:0 auto;display:flex;align-items:center;gap:16px;padding:20px 16px}
#btn-quit{color:var(--gray);font-size:20px;font-weight:800;padding:4px 8px}
#l-progress{flex:1;height:16px;background:var(--border);border-radius:10px;overflow:hidden}
#l-progress-fill{height:100%;background:var(--green);border-radius:10px;width:0;transition:width .4s;position:relative}
#l-progress-fill:after{content:'';position:absolute;right:8px;top:4px;height:5px;width:22px;background:rgba(255,255,255,.35);border-radius:4px}
#l-hearts{color:var(--red);font-weight:800;display:flex;gap:6px;align-items:center;font-size:17px}
#lesson-body{flex:1;overflow-y:auto;display:flex;justify-content:center}
#qbox{width:100%;max-width:640px;padding:10px 20px 40px}
#qbox.locked{pointer-events:none}
.q-title{font-size:23px;font-weight:800;margin:14px 0 22px;line-height:1.3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.list{grid-template-columns:1fr}
.opt{border:2px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;background:#fff;box-shadow:0 2px 0 var(--border);font-weight:700;color:var(--head);transition:border-color .1s;position:relative;min-height:96px;justify-content:center}
.opt:hover{background:#f7f7f7}
.opt .opt-emoji{font-size:48px;line-height:1}
.opt .opt-num{position:absolute;top:8px;left:10px;color:#bfbfbf;font-weight:800;font-size:13px;border:2px solid #e5e5e5;border-radius:6px;padding:0 5px}
.opt.sel{border-color:#84d8ff;background:var(--blue-bg);color:var(--blue-t);box-shadow:0 2px 0 #84d8ff}
.opt.right{border-color:#a5ed6e;background:var(--green-bg);color:var(--green-t)}
.opt.wrongsel{border-color:#ff9a9a;background:var(--red-bg);color:var(--red-d)}
.speak-big{width:110px;height:96px;background:var(--blue);border-radius:16px;box-shadow:0 4px 0 var(--blue-d);display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.speak-big svg{width:52px;height:52px;fill:#fff}
.speak-big:active{transform:translateY(4px);box-shadow:none}
.say-row{display:flex;align-items:flex-end;gap:12px;margin-bottom:26px}
.face{font-size:64px;line-height:1}
.say-bubble{border:2px solid var(--border);border-radius:14px;padding:14px 18px;font-weight:700;color:var(--head);font-size:17px;position:relative;background:#fff}
.say-bubble:before{content:'';position:absolute;left:-9px;bottom:12px;border:8px solid transparent;border-right-color:var(--border);border-left:0}
.say-bubble:after{content:'';position:absolute;left:-5px;bottom:14px;border:6px solid transparent;border-right-color:#fff;border-left:0}
.ans-line{min-height:64px;border-bottom:2px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;padding:8px 2px;margin-bottom:26px;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:#fff;border:2px solid var(--border);border-bottom-width:4px;border-radius:12px;padding:9px 16px;font-weight:700;color:var(--head);font-size:16px;transition:background .1s}
.tile:hover{background:#f7f7f7}
.tile.used{visibility:hidden}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcol{display:flex;flex-direction:column;gap:10px}
.tile.m{width:100%;padding:13px}
.tile.m.sel{border-color:#84d8ff;background:var(--blue-bg);color:var(--blue-t)}
.tile.m.done{opacity:.35;pointer-events:none;background:var(--green-bg);border-color:#a5ed6e;color:var(--green-t)}
.tile.m.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.type-in{width:100%;min-height:120px;border:2px solid var(--border);border-radius:14px;padding:14px;font-family:inherit;font-size:17px;font-weight:600;color:var(--head);resize:none;outline:none}
.type-in:focus{border-color:#84d8ff}

#lesson-bottom{border-top:2px solid var(--border);background:#fff}
#bottom-inner{max-width:900px;margin:0 auto;padding:18px 16px;min-height:110px;display:flex;align-items:center}
.check-row{width:100%;display:flex;justify-content:flex-end}
.note{width:100%;text-align:center;color:var(--gray);font-weight:800;letter-spacing:1px}
.fb{width:100%;display:flex;align-items:center;gap:16px;border-radius:16px;padding:16px 20px}
.fb.ok{background:var(--green-bg)}
.fb.no{background:var(--red-bg)}
.fb-ic{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;flex-shrink:0}
.fb.ok .fb-ic{color:var(--green)}
.fb.no .fb-ic{color:var(--red)}
.fb-l{flex:1}
.fb-t{font-weight:900;font-size:19px}
.fb.ok .fb-t{color:var(--green-t)}
.fb.no .fb-t{color:var(--red-d)}
.fb-s{font-weight:700;margin-top:2px}
.fb.ok .fb-s{color:var(--green-t)}
.fb.no .fb-s{color:var(--red-d)}

/* end screens */
.end-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:30px;text-align:center;overflow:auto}
.end-owl{width:200px;animation:popin .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.end-screen h1{font-size:28px;font-weight:900}
.end-screen p{color:#777;font-weight:700;max-width:420px}
.stat-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.stat{border-radius:14px;overflow:hidden;width:130px;border:2px solid}
.stat .stat-l{font-size:12px;font-weight:900;letter-spacing:.5px;padding:5px;color:#fff;text-transform:uppercase}
.stat .stat-v{background:#fff;font-weight:900;font-size:19px;padding:10px}
.stat.gold{border-color:var(--gold)}.stat.gold .stat-l{background:var(--gold)}
.stat.green{border-color:var(--green)}.stat.green .stat-l{background:var(--green)}
.stat.blue{border-color:var(--blue)}.stat.blue .stat-l{background:var(--blue)}
.end-screen .btn{max-width:340px;width:100%}

/* modal */
#modal-root{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:20px;padding:28px;max-width:420px;width:100%;text-align:center;animation:popin .25s}
.modal h2{font-size:22px;font-weight:900;margin-bottom:8px}
.modal p{color:#777;font-weight:700;margin-bottom:20px}
.modal .btn{width:100%;margin-top:10px}
.modal img{width:120px;margin-bottom:6px}

/* toast */
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);background:#3c3c3c;color:#fff;font-weight:800;padding:12px 22px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* confetti */
.cf{position:fixed;top:-24px;z-index:400;border-radius:3px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}

/* bottom nav */
#bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--border);z-index:60;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
#bottomnav .bn-in{display:flex;justify-content:space-around}
.bn-item{padding:8px 12px;border-radius:12px;color:#777}
.bn-item svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bn-item.active{background:var(--blue-bg);color:var(--blue)}

@media(max-width:1100px){#rail{display:none}}
@media(max-width:900px){
  #sidebar{display:none}
  #main{margin-left:0}
  #bottomnav{display:block}
  .page{padding-bottom:140px}
  .opts{grid-template-columns:1fr 1fr}
  .stat-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="sidebar">
  <div id="logo">duolingo</div>
  <nav id="sidenav"></nav>
</div>

<div id="main">
  <header id="topbar"><div class="tb-in" id="tb-in"></div></header>
  <section class="page" id="page-home"><div class="home-grid"><div id="path"></div><aside id="rail"></aside></div></section>
  <section class="page" id="page-lead"></section>
  <section class="page" id="page-quests"></section>
  <section class="page" id="page-shop"></section>
  <section class="page" id="page-profile"></section>
</div>

<nav id="bottomnav"><div class="bn-in" id="bn-in"></div></nav>
<div id="overlay" class="hidden"></div>
<div id="modal-root" class="hidden"></div>
<div id="toast"></div>

<script>
/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);

let AC=null;
function ctx(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,when,vol){try{const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||.18;o.connect(g);g.connect(c.destination);const t=c.currentTime+(when||0);o.start(t);g.gain.setValueAtTime(vol||.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.stop(t+d);}catch(e){}}
function sfxClick(){tone(700,.06,'triangle',0,.08);}
function sfxGood(){tone(660,.12,'sine');tone(880,.22,'sine',.12);}
function sfxBad(){tone(196,.25,'sawtooth',0,.12);tone(147,.3,'sawtooth',.15,.12);}
function sfxWin(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',i*.12,.15));}
function speak(txt){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';u.rate=.92;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}

/* ================= PATH ================= */
function unitDone(ui){return UNITS[ui].nodes.every(n=>state.completed[n.k]);}
function nodeState(ui,ni){
 if(ui>0&&!unitDone(ui-1))return 'locked';
 const n=UNITS[ui].nodes[ni];
 if(n.type==='c')return state.opened[n.k]?'opened':(ni===0||state.completed[UNITS[ui].nodes[ni-1].k]?'active':'locked');
 if(state.completed[n.k])return 'done';
 const prior=UNITS[ui].nodes.slice(0,ni).every(p=>state.completed[p.k]);
 return prior?'active':'locked';
}
function renderPath(){
 const path=$('#path');let html='';let g=0;
 UNITS.forEach((u,ui)=>{
  const locked=ui>0&&!unitDone(ui-1);
  html+=`<div class="unit-wrap ${locked?'unit-locked':''}" style="width:100%">
    <div class="unit-banner" style="background:${u.color}" onclick="${locked?`toast('Complete the previous unit to unlock! 🔒')`:''}">
      <div class="ub-l"><small>Unit ${ui+1}</small><h2>${u.title}</h2><p>${locked?'Locked — finish the previous unit':'Learn Spanish by practicing these skills'}</p></div>
      <button class="ub-book" onclick="event.stopPropagation();toast('Guidebook: review the vocabulary of this unit! 📖')"></button>
    </div></div>`;
  u.nodes.forEach((n,ni)=>{
    const st=nodeState(ui,ni);
    const off=Math.round(Math.sin(g*1.05)*85);g++;
    let inner='',cls='';
    if(n.type==='c'){
      cls='chest'+(st==='opened'?' opened':st==='active'?'':' locked-n');
      inner=st==='opened'?'🎁':'';
    }else{
      cls=st==='active'?'active-n':st==='done'?'done-n':'locked-n';
      inner=st==='done'?CHECK:(st==='locked'?LOCK:STAR);
    }
    const click=n.type==='c'?`openChest('${n.k}',${n.gems},${st==='active'},'${st}')`:`nodeClick(${ui},${ni},'${st}')`;
    html+=`<div class="node-wrap" style="transform:translateX(${off}px)">
      ${st==='active'?'<div class="start-bubble">START</div>':''}
      <button class="node ${cls}" onclick="${click}">${n.type==='c'?'':(st==='active'?'<span class="ring"></span>':'')}${inner}</button>
    </div>`;
  });
 });
 path.innerHTML=html;
}
function nodeClick(ui,ni,st){
 const n=UNITS[ui].nodes[ni];
 if(st==='locked'){toast('Complete the previous lessons to unlock! 🔒');return;}
 sfxClick();
 startLesson(n.lesson,n.k,false);
}
function openChest(k,gems,active,st){
 if(st==='locked'){toast('Complete the previous lessons to unlock! 🔒');return;}
 if(state.opened[k]){toast('You already opened this chest!');return;}
 state.opened[k]=true;state.gems+=gems;state.gemsEarned+=gems;save();
 sfxWin();confetti();renderTopbar();renderPath();renderRail();
 toast('+'+gems+' gems! 💎');
}

function msToMonday(){const d=new Date();const day=d.getDay();const diff=((8-day)%7)||7;const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()+diff);return t-d;}
function renderLead(){
 const fake=[['Sofía M.','🦊',34],['Liam','🐼',29],['Emma','🐸',26],['Mateo','🦁',24],['Olivia','🐨',21],['Noah','🐯',18],['Valentina','🦄',15],['Diego','🐙',12],['Ava','🐹',9],['Lucas','🐢',6]];
 const rows=fake.map(f=>({name:f[0],ava:f[1],xp:f[2],me:false}));
 rows.push({name:'You',ava:'🦉',xp:state.weekXp,me:true});
 rows.sort((a,b)=>b.xp-a.xp);
 const t=msToMonday();const dd=Math.floor(t/864e5),hh=Math.floor(t%864e5/36e5);
 let html=`<div class="lb-wrap"><div class="lb-head"><div class="cup">🏆</div><h1>Silver League</h1><p>Top 10 advance to the next league</p><span class="ends">⏳ Ends in ${dd}d ${hh}h</span></div>`;
 rows.forEach((r,i)=>{
  const zone=i<4?'zone-up':i>=rows.length-3?'zone-dn':'';
  if(i===4)html+=`<div class="lb-div">▲ PROMOTION ZONE</div>`;
  if(i===rows.length-3)html+=`<div class="lb-div dn">▼ DEMOTION ZONE</div>`;
  html+=`<div class="lb-row ${zone} ${r.me?'me':''}"><span class="rank">${i+1}</span><span class="ava">${r.ava}</span><span class="nm">${r.name}${r.me?' ⭐':''}</span><span class="xp">${r.xp} XP</span></div>`;
 });

}

 sfxWin();confetti();renderTopbar();renderQuests();toast('+20 gems! 💎');
}

/* ================= SHOP ================= */
function renderShop(){
 const hFull=state.hearts>=5;
 $('#page-shop').innerHTML=`<div class="lb-wrap" style="max-width:760px">
  <div style="display:flex;justify-content:space-between;align-items:center"><h1 class="page-title" style="margin:18px 0 6px">🛍️ Shop</h1><span class="shop-gems">💎 ${state.gems}</span></div>
  <div class="shop-sec">Power-ups</div>
  <div class="shop-grid">
   <div class="shop-item"><div class="si">❄️</div><b>Streak Freeze</b><p>Protect your streak for one day you miss. Owned: ${state.freezes}</p><button class="price-btn" onclick="buy('freeze',200)" ${state.gems<200?'disabled':''}>200 💎</button></div>
   <div class="shop-item"><div class="si">❤️</div><b>Heart Refill</b><p>Refill your hearts to 5 so you can keep learning.</p><button class="price-btn" onclick="buy('hearts',350)" ${state.gems<350||hFull?'disabled':''}>350 💎</button></div>
   <div class="shop-item"><div class="si">⚡</div><b>Double XP</b><p>Your next completed lesson earns double XP.${state.doubleNext?' (ACTIVE!)':''}</p><button class="price-btn" onclick="buy('double',200)" ${state.gems<200||state.doubleNext?'disabled':''}>200 💎</button></div>
  </div>
  <div class="shop-sec">Duo outfits</div>
  <div class="shop-grid">
   <div class="shop-item"><div class="si">🎩</div><b>Fancy Hat</b><p>Duo looks dapper for fancy lessons.</p><button class="price-btn" onclick="buy('outfit:🎩',500)" ${state.outfits.includes('🎩')||state.gems<500?'disabled':''}>${state.outfits.includes('🎩')?'OWNED':'500 💎'}</button></div>
   <div class="shop-item"><div class="si">🕶️</div><b>Cool Shades</b><p>Too cool for school. Too cool for verbs.</p><button class="price-btn" onclick="buy('outfit:🕶️',300)" ${state.outfits.includes('🕶️')||state.gems<300?'disabled':''}>${state.outfits.includes('🕶️')?'OWNED':'300 💎'}</button></div>
   <div class="shop-item"><div class="si">🧢</div><b>Sporty Cap</b><p>For when Duo goes jogging in Spanish.</p><button class="price-btn" onclick="buy('outfit:🧢',250)" ${state.outfits.includes('🧢')||state.gems<250?'disabled':''}>${state.outfits.includes('🧢')?'OWNED':'250 💎'}</button></div>
  </div></div>`;
}
function buy(item,price){
 if(state.gems<price){toast('Not enough gems! 💎');return;}
 state.gems-=price;
 if(item==='freeze'){state.freezes++;toast('Streak Freeze equipped! ❄️');}
 if(item==='hearts'){state.hearts=5;toast('Hearts refilled! ❤️');}
 if(item==='double'){state.doubleNext=true;toast('Double XP active for your next lesson! ⚡');}
 if(item.startsWith('outfit:')){const o=item.split(':')[1];state.outfits.push(o);toast('Duo loves the new look! '+o);}
 save();sfxClick();renderTopbar();renderShop();
}

/* ================= PROFILE ================= */
function renderProfile(){
 const done=Object.keys(state.completed).filter(k=>!k.endsWith('c')).length;
 const ach=[
  ['🔥','Wildfire','Reach a 7 day streak',state.streak,7],
  ['🧠','Sage','Earn 200 total XP',state.xp,200],
  ['📚','Scholar','Complete 10 lessons',done,10],
  ['💎','Treasure Hunter','Earn 600 gems in total',state.gemsEarned,600],
  ['🏆','Champion','Earn 30 XP in a week',state.weekXp,30]
 ];
 $('#page-profile').innerHTML=`<div class="lb-wrap" style="max-width:700px">
  <div class="prof-head"><img src="${OWL_HAPPY}" alt="Duo"><div><h1>Duo Learner</h1><p>Joined ${state.joined} · 🇪🇸 Learning Spanish${state.outfits.length?' · Outfits: '+state.outfits.join(' '):''}</p></div></div>
  <h3 style="font-weight:900;font-size:18px;margin:10px 0 4px">Statistics</h3>
  <div class="stat-grid">
   <div class="stat-box"><span class="sbi">🔥</span><div><small>Day streak</small>${state.streak}</div></div>
   <div class="stat-box"><span class="sbi">⚡</span><div><small>Total XP</small>${state.xp}</div></div>
   <div class="stat-box"><span class="sbi">🏆</span><div><small>Current league</small>Silver</div></div>
   <div class="stat-box"><span class="sbi">📗</span><div><small>Lessons completed</small>${done}</div></div>
  </div>
  <h3 style="font-weight:900;font-size:18px;margin:18px 0 10px">Achievements</h3>
  ${ach.map(a=>`<div class="ach"><span class="ai">${a[0]}</span><div class="at"><b>${a[1]}</b><small>${a[2]}</small><div class="pbar"><i style="width:${Math.min(a[3]/a[4]*100,100)}%"></i></div></div><span class="qn" style="font-weight:800;color:#777">${Math.min(a[3],a[4])}/${a[4]}</span></div>`).join('')}
  <button class="reset-link" onclick="if(confirm('Reset all demo progress?')){localStorage.removeItem('duo_state');location.reload();}">Reset demo progress</button>
 </div>`;
}

/* ================= LESSON ENGINE ================= */
let cur=null;
const PRAISE=['Excellent!','Great job!','Nice work!','Amazing!','You are on fire!','¡Excelente!'];
const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];

function startLesson(lesson,nodeKey,practice){
 if(!practice&&state.hearts<=0){noHeartsModal(()=>startLesson(lesson,nodeKey,practice));return;}
 cur={lesson:lesson,nodeKey:nodeKey,idx:0,correct:0,wrong:0,practice:practice,locked:false};
 openLessonShell();renderQuestion();
}
function startPractice(){
 const pool=[];UNITS.forEach(u=>u.nodes.forEach(n=>{if(n.type==='l')n.lesson.forEach(q=>pool.push(q));}));
 startLesson({questions:shuffle(pool).slice(0,6)},null,true);
 toast('Practice session: no hearts at risk! 💪');
}
function openLessonShell(){
 $('#overlay').classList.remove('hidden');document.body.style.overflow='hidden';
 $('#overlay').innerHTML=`
  <div id="lesson-top">
    <button id="btn-quit" onclick="quitModal()">✕</button>
    <div id="l-progress"><div id="l-progress-fill"></div></div>
    <div id="l-hearts">❤️ <span id="l-hearts-n">${state.hearts}</span></div>
  </div>
  <div id="lesson-body"><div id="qbox"></div></div>
  <div id="lesson-bottom"><div id="bottom-inner"></div></div>`;
}
function renderQuestion(){
 const q=cur.lesson.questions[cur.idx];cur.q=q;cur.locked=false;
 $('#l-progress-fill').style.width=(cur.idx/cur.lesson.questions.length*100)+'%';
 $('#l-hearts-n').textContent=state.hearts;
 const box=$('#qbox');box.classList.remove('locked');
 if(q.t==='select'||q.t==='listen'){
  cur.opts=shuffle(q.opts);cur.sel=-1;
  box.innerHTML=`<h2 class="q-title">${q.prompt}</h2>
   ${q.t==='listen'?`<button class="speak-big" onclick="speak('${q.word}')">${SPK}</button>`:''}
   <div class="opts ${q.t==='listen'?'list':''}">
    ${cur.opts.map((o,i)=>`<button class="opt" id="opt-${i}" onclick="pickOpt(${i})">${o.img?`<div class="opt-emoji">${o.img}</div>`:`<span class="opt-num">${i+1}</span>`}<div class="opt-text">${o.text}</div></button>`).join('')}
   </div>`;
  if(q.t==='listen')setTimeout(()=>speak(q.word),350);
  setBottomCheck(false);
 }else if(q.t==='arrange'){
  cur.bank=shuffle([...q.answer,...(q.extra||[])]);cur.ans=[];
  box.innerHTML=`<h2 class="q-title">Translate this sentence</h2>
   <div class="say-row"><span class="face">👩</span><span class="say-bubble">${q.text}</span></div>
   <div class="ans-line" id="ans-line"></div>
   <div class="bank" id="bank">${cur.bank.map((w,i)=>`<button class="tile" id="tile-${i}" onclick="takeTile(${i})">${w}</button>`).join('')}</div>`;
  setBottomCheck(false);
 }else if(q.t==='match'){
  const m=cur.match={left:shuffle(q.pairs.map(p=>p[0])),right:shuffle(q.pairs.map(p=>p[1])),doneL:{},doneR:{},selL:-1,selR:-1,total:q.pairs.length,matched:0};
  box.innerHTML=`<h2 class="q-title">Tap the pairs</h2>
   <div class="match-grid">
    <div class="mcol">${m.left.map((w,i)=>`<button class="tile m" id="ml-${i}" onclick="pickMatch('L',${i})">${w}</button>`).join('')}</div>
    <div class="mcol">${m.right.map((w,i)=>`<button class="tile m" id="mr-${i}" onclick="pickMatch('R',${i})">${w}</button>`).join('')}</div>
   </div>`;
  $('#bottom-inner').innerHTML=`<div class="note">TAP THE MATCHING PAIRS</div>`;
 }else if(q.t==='type'){
  box.innerHTML=`<h2 class="q-title">Write this in Spanish</h2>
   <div class="say-row"><span class="face">🧑</span><span class="say-bubble">${q.text}</span></div>
   <textarea id="type-in" class="type-in" placeholder="Type in Spanish" oninput="setBottomCheck(this.value.trim().length>0)"></textarea>`;
  setBottomCheck(false);
 }
}
function pickOpt(i){if(cur.locked)return;sfxClick();cur.sel=i;cur.opts.forEach((o,j)=>$('#opt-'+j).classList.toggle('sel',j===i));setBottomCheck(true);}
function takeTile(i){if(cur.locked)return;sfxClick();$('#tile-'+i).classList.add('used');cur.ans.push({i:i,w:cur.bank[i]});renderAns();setBottomCheck(true);}
function dropTile(ai){if(cur.locked)return;sfxClick();const a=cur.ans[ai];$('#tile-'+a.i).classList.remove('used');cur.ans.splice(ai,1);renderAns();setBottomCheck(cur.ans.length>0);}
function renderAns(){$('#ans-line').innerHTML=cur.ans.map((a,ai)=>`<button class="tile" onclick="dropTile(${ai})">${a.w}</button>`).join('');}
function onType(){}
function pickMatch(side,i){
 if(cur.locked)return;const m=cur.match;
 if((side==='L'&&m.doneL[i])||(side==='R'&&m.doneR[i]))return;
 sfxClick();
 if(side==='L')m.selL=(m.selL===i?-1:i);else m.selR=(m.selR===i?-1:i);
 m.left.forEach((w,j)=>$('#ml-'+j).classList.toggle('sel',j===m.selL));
 m.right.forEach((w,j)=>$('#mr-'+j).classList.toggle('sel',j===m.selR));
 if(m.selL>-1&&m.selR>-1){
  const lw=m.left[m.selL],rw=m.right[m.selR];
  const pair=cur.q.pairs.find(p=>p[0]===lw);
  if(pair&&pair[1]===rw){
   m.doneL[m.selL]=1;m.doneR[m.selR]=1;m.matched++;sfxGood();
   cur.correct++;bumpQuest('correct',1);
   $('#ml-'+m.selL).classList.add('done');$('#mr-'+m.selR).classList.add('done');
   if(m.matched===m.total){cur.locked=true;setTimeout(()=>showBanner(true,praise()),450);}
  }else{
   sfxBad();
   const a=$('#ml-'+m.selL),b=$('#mr-'+m.selR);
   a.classList.add('shake');b.classList.add('shake');
   setTimeout(()=>{a.classList.remove('shake');b.classList.remove('shake');},450);
  }
  m.selL=-1;m.selR=-1;
  m.left.forEach((w,j)=>$('#ml-'+j).classList.remove('sel'));
  m.right.forEach((w,j)=>$('#mr-'+j).classList.remove('sel'));
 }
}
function setBottomCheck(on){
 $('#bottom-inner').innerHTML=`<div class="check-row"><button id="btn-check" class="btn ${on?'btn-green':'btn-disabled'}" onclick="check()">CHECK</button></div>`;
}
function check(){
 if(cur.locked)return;
 const q=cur.q;let ok=false,sol='';
 if(q.t==='select'||q.t==='listen'){
  if(cur.sel<0)return;
  ok=!!cur.opts[cur.sel].ok;
  sol=(q.opts.find(o=>o.ok)||{}).text||'';
  cur.opts.forEach((o,i)=>{const el=$('#opt-'+i);if(o.ok)el.classList.add('right');else if(i===cur.sel)el.classList.add('wrongsel');});
 }else if(q.t==='arrange'){
  const user=cur.ans.map(a=>a.w).join(' ');
  ok=norm(user)===norm(q.answer.join(' '));
  sol=q.answer.join(' ');
 }else if(q.t==='type'){
  const v=norm($('#type-in').value);
  ok=q.accept.some(a=>norm(a)===v);
  sol=q.sol||q.accept[0];
 }
 resolve(ok,sol);
}
function resolve(ok,sol){
 cur.locked=true;$('#qbox').classList.add('locked');
 if(ok){
  cur.correct++;bumpQuest('correct',1);sfxGood();showBanner(true,praise());
 }else{
  cur.wrong++;sfxBad();
  if(!cur.practice){state.hearts=Math.max(0,state.hearts-1);save();$('#l-hearts-n').textContent=state.hearts;renderTopbar();}
  showBanner(false,sol);
  if(state.hearts<=0&&!cur.practice){setTimeout(showFail,1400);return;}
 }
}
function showBanner(ok,sol){
 $('#bottom-inner').innerHTML=`<div class="fb ${ok?'ok':'no'}">
  <div class="fb-ic">${ok?'✓':'✕'}</div>
  <div class="fb-l"><div class="fb-t">${ok?sol:'Correct solution:'}</div>${ok?'':`<div class="fb-s">${sol}</div>`}</div>
  <button class="btn ${ok?'btn-green':'btn-red'}" onclick="advance()">CONTINUE</button>
 </div>`;
}
function advance(){
 cur.idx++;
 if(cur.idx>=cur.lesson.questions.length){finish();}
 else{renderQuestion();$('#lesson-body').scrollTop=0;}
}
function updateStreak(){
 const t=todayStr();
 if(state.lastDone===t)return;
 state.streak=(state.lastDone===yestStr())?state.streak+1:1;
 state.lastDone=t;
}
function finish(){
 const perfect=cur.wrong===0;
 let xp=cur.practice?5:10+(perfect?5:0);
 if(state.doubleNext&&!cur.practice){xp*=2;state.doubleNext=false;}
 state.xp+=xp;state.weekXp+=xp;
 bumpQuest('xp',xp);
 if(!cur.practice){bumpQuest('lessons',1);if(cur.nodeKey)state.completed[cur.nodeKey]=true;updateStreak();}
 save();
 const acc=Math.round(100*cur.correct/(cur.correct+cur.wrong||1));
 $('#overlay').innerHTML=`<div class="end-screen">
  <img class="end-owl" src="${OWL_HAPPY}" alt="Duo">
  <h1>${perfect?'Perfect lesson!':'Lesson complete!'}</h1>
  <div class="stat-row">
   <div class="stat gold"><div class="stat-l">Total XP</div><div class="stat-v">+${xp}</div></div>
   <div class="stat green"><div class="stat-l">Accuracy</div><div class="stat-v">${acc}%</div></div>
   <div class="stat blue"><div class="stat-l">Streak</div><div class="stat-v">🔥 ${state.streak}</div></div>
  </div>
  <button class="btn btn-green big" onclick="closeLesson()">CONTINUE</button>
 </div>`;
 sfxWin();confetti();
}
function showFail(){
 $('#overlay').innerHTML=`<div class="end-screen">
  <img class="end-owl" src="${OWL_SAD}" alt="Duo">
  <h1>You ran out of hearts!</h1>
  <p>Don't worry — refill your hearts and keep going, or end the session and try again later.</p>
  <button class="btn btn-red big" onclick="refillContinue()">REFILL HEARTS — 350 💎</button>
  <button class="btn btn-white big" onclick="closeLesson()">END SESSION</button>
 </div>`;
}
function refillContinue(){
 if(state.gems<350){toast('Not enough gems! 💎');closeLesson();return;}
 state.gems-=350;state.hearts=5;save();renderTopbar();
 openLessonShell();renderQuestion();advance();
}
function closeLesson(){
 $('#overlay').classList.add('hidden');document.body.style.overflow='';
 cur=null;renderTopbar();showPage('home');
}
function quitModal(){
 $('#modal-root').classList.remove('hidden');
 $('#modal-root').innerHTML=`<div class="modal">
  <img src="${OWL_SAD}" alt="">
  <h2>Wait, don't go!</h2>
  <p>If you leave now, you'll lose your progress in this lesson.</p>
  <button class="btn btn-green" onclick="closeModal()">KEEP LEARNING</button>
  <button class="btn btn-red" onclick="closeModal();closeLesson()">END SESSION</button>
 </div>`;
}
function noHeartsModal(pending){
 window._pending=pending;
 $('#modal-root').classList.remove('hidden');
 $('#modal-root').innerHTML=`<div class="modal">
  <img src="${OWL_SAD}" alt="">
  <h2>You're out of hearts!</h2>
  <p>Refill your hearts with gems, or practice old lessons to play it safe.</p>
  <button class="btn btn-red" onclick="refillFromModal()">REFILL — 350 💎</button>
  <button class="btn btn-white" onclick="closeModal();startPractice()">PRACTICE INSTEAD</button>
  <button class="btn btn-white" onclick="closeModal()">NOT NOW</button>
 </div>`;
}
function refillFromModal(){
 if(state.gems<350){toast('Not enough gems! 💎');closeModal();return;}
 state.gems-=350;state.hearts=5;save();renderTopbar();closeModal();
 if(window._pending){const f=window._pending;window._pending=null;f();}
}
function closeModal(){$('#modal-root').classList.add('hidden');}

/* ================= TOAST & CONFETTI ================= */
let toastT=null;
function toast(msg){
 const t=$('#toast');t.textContent=msg;t.classList.add('show');
 clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);
}
function confetti(){
 const colors=['#58cc02','#1cb0f6','#ffc800','#ff4b4b','#ce82ff','#ff9600'];
 for(let i=0;i<70;i++){
  const c=document.createElement('div');c.className='cf';
  c.style.left=Math.random()*100+'vw';
  c.style.background=colors[Math.floor(Math.random()*colors.length)];
  c.style.width=(6+Math.random()*8)+'px';c.style.height=(8+Math.random()*10)+'px';
  c.style.animationDuration=(2+Math.random()*2)+'s';
  c.style.animationDelay=(Math.random()*.6)+'s';
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),5000);
 }
}

/* keyboard */
document.addEventListener('keydown',e=>{
 if(e.key!=='Enter')return;
 const b=$('#btn-check');if(b&&!b.classList.contains('btn-disabled')){check();return;}
 const fb=$('#bottom-inner .fb .btn');if(fb)fb.click();
});

/* init */
buildNav();renderTopbar();showPage('home');
</script>
