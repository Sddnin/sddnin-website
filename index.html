<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Học Từ Vựng</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #4a90e2;
            --light-blue: #eef7ff;
            --text-dark: #333;
            --shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            padding: 20px;
        }

        /* Header đơn giản */
        .header {
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
            color: var(--primary-blue);
        }
        .header i { margin-right: 8px; }

        /* Thanh tìm kiếm */
        .search-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .search-container input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }
        .search-container button {
            width: 40px;
            border: none;
            background: var(--primary-blue);
            color: white;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Card Flashcard */
        .flashcard-wrapper {
            perspective: 1000px;
            width: 320px;
            height: 200px;
            margin-bottom: 25px;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            cursor: pointer;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .card.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #5da0f4, #4a90e2);
            color: white;
            font-size: 28px;
            font-weight: 500;
            padding: 20px;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #ffffff;
            color: #333;
            border: 1px solid #eee;
        }

        .flip-icon-center {
            margin-top: 15px;
            font-size: 14px;
            background: rgba(255,255,255,0.3);
            padding: 5px 12px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Nút điều khiển chính */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .controls button {
            padding: 8px 20px;
            border: 1px solid var(--primary-blue);
            background: white;
            color: var(--primary-blue);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .controls button:hover {
            background: var(--primary-blue);
            color: white;
        }
        .controls button.active-btn {
            background: var(--primary-blue);
            color: white;
        }

        /* Các nút hành động (Yêu thích, Thuộc...) */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .action-buttons button {
            padding: 6px 15px;
            border: none;
            background: white;
            color: #555;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            font-size: 13px;
        }
        .action-buttons button i { margin-right: 5px; }
        .action-buttons button.active { background: #f0f4f8; color: #4a90e2; }
        .action-buttons button.active-love { background: #ffeaea; color: #e74c3c; }
        .action-buttons button.active-hard { background: #fff3e0; color: #f39c12; }

        /* Tiến độ */
        .progress-container {
            width: 300px;
            text-align: center;
            font-size: 14px;
            color: #777;
            margin-top: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary-blue);
            transition: width 0.3s;
            width: 0%;
        }

        /* Footer */
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-layer-group"></i> Flashcard
    </div>

    <div class="search-container">
        <input type="text" placeholder="Tìm kiếm từ vựng...">
        <button><i class="fas fa-search"></i></button>
    </div>

    <div class="flashcard-wrapper">
        <div class="card" id="flashcard" onclick="handleCardClick(event)">
            <div class="card-face card-front">
                <span id="front-text">안녕하세요</span>
                <div class="flip-icon-center">
                    <i class="fas fa-sync-alt"></i> Lật
                </div>
            </div>
            <div class="card-face card-back">
                <span id="back-text">Xin chào</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()"><i class="fas fa-minus"></i> Trước</button>
        <button class="active-btn" onclick="flipCard()"><i class="fas fa-sync-alt"></i> Lật thẻ</button>
        <button onclick="nextCard()">Sau <i class="fas fa-plus"></i></button>
    </div>

    <div class="action-buttons">
        <button id="btn-fav" onclick="toggleStatus('fav')"><i class="far fa-heart"></i> Yêu thích</button>
        <button id="btn-learnt" onclick="toggleStatus('learnt')"><i class="far fa-check-circle"></i> Đã thuộc</button>
        <button id="btn-hard" onclick="toggleStatus('hard')"><i class="fas fa-exclamation-triangle"></i> Từ khó</button>
    </div>

    <div class="progress-container">
        <span id="current-idx">1</span> / <span id="total-idx">60</span>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="footer">
        © 2024 Flashcard Hub
    </div>

    <script>
        // 1. Dữ liệu Flashcards (Bạn có thể thêm từ vựng vào đây)
        const flashcards = [
            { front: "안녕하세요", back: "Xin chào", fav: false, learnt: false, hard: false },
            { front: "감사합니다", back: "Cảm ơn", fav: false, learnt: false, hard: false },
            { front: "죄송합니다", back: "Xin lỗi", fav: false, learnt: false, hard: false },
            { front: "사랑해요", back: "Yêu em/anh", fav: false, learnt: false, hard: false },
            { front: "맛있어요", back: "Ngon quá", fav: false, learnt: false, hard: false },
            { front: "안녕", back: "Chào (thân mật)", fav: false, learnt: false, hard: false },
            { front: "물", back: "Nước", fav: false, learnt: false, hard: false },
            { front: "친구", back: "Bạn bè", fav: false, learnt: false, hard: false }
        ];

        // 2. Biến trạng thái
        let currentIndex = 0;
        const card = document.getElementById('flashcard');
        const frontText = document.getElementById('front-text');
        const backText = document.getElementById('back-text');
        const currentIdxSpan = document.getElementById('current-idx');
        const totalIdxSpan = document.getElementById('total-idx');
        const progressFill = document.getElementById('progress-fill');

        // 3. Cập nhật giao diện
        function updateCard() {
            // Reset lật thẻ
            card.classList.remove('is-flipped');
            
            // Cập nhật nội dung
            const currentCard = flashcards[currentIndex];
            frontText.innerText = currentCard.front;
            backText.innerText = currentCard.back;

            // Cập nhật tiến độ
            currentIdxSpan.innerText = currentIndex + 1;
            totalIdxSpan.innerText = flashcards.length;
            const progressPercent = ((currentIndex + 1) / flashcards.length) * 100;
            progressFill.style.width = progressPercent + '%';

            // Cập nhật trạng thái nút (Yêu thích, Đã thuộc, Từ khó)
            const btnFav = document.getElementById('btn-fav');
            const btnLearnt = document.getElementById('btn-learnt');
            const btnHard = document.getElementById('btn-hard');

            btnFav.innerHTML = (currentCard.fav ? '<i class="fas fa-heart"></i>' : '<i class="far fa-heart"></i>') + ' Yêu thích';
            btnFav.className = currentCard.fav ? 'active-love' : '';
            
            btnLearnt.innerHTML = (currentCard.learnt ? '<i class="fas fa-check-circle"></i>' : '<i class="far fa-check-circle"></i>') + ' Đã thuộc';
            btnLearnt.className = currentCard.learnt ? 'active' : '';

            btnHard.innerHTML = (currentCard.hard ? '<i class="fas fa-exclamation-triangle"></i>' : '<i class="fas fa-exclamation-triangle"></i>') + ' Từ khó';
            btnHard.className = currentCard.hard ? 'active-hard' : '';
        }

        // 4. Các hành động
        function flipCard() {
            card.classList.toggle('is-flipped');
        }

        // Ngăn chặn nút lật ở giữa thẻ kích hoạt click đúp (gây lỗi)
        function handleCardClick(e) {
            // Lật thẻ khi click vào vùng trống
            flipCard();
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            } else {
                alert("Bạn đang ở thẻ đầu tiên!");
            }
        }

        function nextCard() {
            if (currentIndex < flashcards.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                alert("Bạn đã học hết bộ thẻ này!");
            }
        }

        function toggleStatus(type) {
            const card = flashcards[currentIndex];
            if (type === 'fav') card.fav = !card.fav;
            if (type === 'learnt') card.learnt = !card.learnt;
            if (type === 'hard') card.hard = !card.hard;
            updateCard(); // Cập nhật lại nút bấm
        }

        // Khởi tạo lần đầu
        updateCard();

    </script>
</body>
</html>
