<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-blue: #4a90e2; --shadow: 0 10px 20px rgba(0,0,0,0.1); }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f8f9fa; padding: 20px; }
        .header { width: 100%; max-width: 600px; text-align: center; margin-bottom: 15px; font-size: 24px; font-weight: 600; color: var(--primary-blue); }
        
        /* Chuyển đổi chế độ Học / Chơi */
        .mode-switcher { display: flex; background: #e9ecef; border-radius: 25px; padding: 4px; margin-bottom: 20px; width: 100%; max-width: 320px; }
        .mode-switcher button { flex: 1; border: none; background: transparent; padding: 8px 15px; border-radius: 20px; font-weight: 600; cursor: pointer; color: #666; transition: 0.3s; font-size: 14px; }
        .mode-switcher button.active-mode { background: white; color: var(--primary-blue); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

        .search-container { width: 100%; max-width: 400px; display: flex; gap: 10px; margin-bottom: 20px; position: relative; }
        .search-container input { flex: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 14px; }
        .search-container button { width: 40px; border: none; background: var(--primary-blue); color: white; border-radius: 50%; cursor: pointer; transition: 0.2s; }
        .search-container button:hover { background: #357abd; }

        /* Flashcard */
        .flashcard-wrapper { perspective: 1000px; width: 100%; max-width: 400px; height: 240px; margin-bottom: 20px; position: relative; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; border-radius: 15px; box-shadow: var(--shadow); }
        .card.is-flipped { transform: rotateY(180deg); }
        
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(145deg, #5da0f4, #4a90e2); color: white; padding: 30px; text-align: center; }
        .card-back { transform: rotateY(180deg); background: #ffffff; color: #333; border: 1px solid #eee; }
        
        .word-wrap { display: flex; flex-direction: column; gap: 8px; }
        .korean { font-size: 32px; font-weight: 600; letter-spacing: 1px; }
        .vietnamese { font-size: 28px; font-weight: 500; color: var(--primary-blue); }
        .roman { font-size: 16px; color: rgba(255,255,255,0.75); }
        .card-back .roman { color: #888; }
        
        .flip-icon-center { margin-top: 20px; font-size: 14px; background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 15px; display: flex; align-items: center; gap: 5px; }
        .card-back .flip-icon-center { background: #f0f0f0; color: #555; }

        .btn-speak { position: absolute; top: 15px; right: 15px; border: none; background: rgba(255,255,255,0.2); color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 16px; z-index: 10; transition: 0.2s; }
        .card-back .btn-speak { background: #e3f2fd; color: #4a90e2; }
        .btn-speak:hover { transform: scale(1.1); background: #fff; color: #4a90e2; }
        .card-back .btn-speak:hover { background: var(--primary-blue); color: white; }

        .controls { display: flex; gap: 15px; margin-bottom: 15px; }
        .controls button { padding: 8px 20px; border: 1px solid var(--primary-blue); background: white; color: var(--primary-blue); border-radius: 20px; cursor: pointer; transition: 0.2s; }
        .controls button:hover, .controls button.active-btn { background: var(--primary-blue); color: white; }
        
        .action-buttons { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
        .action-buttons button { padding: 6px 15px; border: none; background: white; color: #555; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); cursor: pointer; font-size: 13px; }
        .action-buttons button i { margin-right: 5px; }
        .action-buttons button.active-love { background: #ffeaea; color: #e74c3c; }
        .action-buttons button.active-learnt { background: #e8f5e9; color: #2e7d32; }
        .action-buttons button.active-hard { background: #fff3e0; color: #f39c12; }

        .progress-container { width: 100%; max-width: 300px; text-align: center; font-size: 14px; color: #777; margin-top: 10px; }
        .progress-bar { width: 100%; height: 6px; background: #e9ecef; border-radius: 3px; margin-top: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary-blue); transition: width 0.3s; width: 0%; }

        /* Giao diện Mini Game Trắc Nghiệm */
        #game-container { width: 100%; max-width: 400px; background: white; border-radius: 15px; padding: 20px; box-shadow: var(--shadow); }
        .game-stats { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 15px; color: #444; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .quiz-card { background: linear-gradient(145deg, #5da0f4, #4a90e2); color: white; border-radius: 12px; padding: 25px 15px; text-align: center; margin-bottom: 15px; position: relative; }
        .quiz-question { font-size: 28px; font-weight: 700; margin-bottom: 5px; }
        .quiz-roman { font-size: 14px; opacity: 0.85; }
        .btn-quiz-speak { border: none; background: rgba(255,255,255,0.25); color: white; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 13px; margin-top: 10px; transition: 0.2s; }
        .btn-quiz-speak:hover { background: white; color: var(--primary-blue); }
        
        .quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .quiz-opt-btn { background: #f8f9fa; border: 1px solid #ddd; padding: 12px 10px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 500; color: #333; transition: 0.2s; text-align: center; word-break: break-word; }
        .quiz-opt-btn:hover { background: #e3f2fd; border-color: #4a90e2; color: #4a90e2; }
        .quiz-opt-btn.correct { background: #2e7d32 !important; color: white !important; border-color: #2e7d32 !important; }
        .quiz-opt-btn.wrong { background: #c0392b !important; color: white !important; border-color: #c0392b !important; }
        
        .quiz-feedback { text-align: center; min-height: 24px; font-weight: 600; margin-top: 12px; font-size: 14px; }
        
        .footer { margin-top: 25px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <div class="header"><i class="fas fa-language"></i> 120 Từ vựng Hàn Quốc</div>
    
    <!-- Nút chuyển chế độ -->
    <div class="mode-switcher">
        <button id="mode-flashcard" class="active-mode" onclick="switchMode('flashcard')"><i class="fas fa-clone"></i> Flashcard</button>
        <button id="mode-game" onclick="switchMode('game')"><i class="fas fa-gamepad"></i> Mini Game</button>
    </div>

    <!-- Chế độ Flashcard -->
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Tìm kiếm (Tiếng Hàn, Tiếng Việt không dấu/có dấu)..." onkeyup="if(event.key==='Enter') searchWord()">
        <button onclick="searchWord()"><i class="fas fa-search"></i></button>
    </div>

    <div class="flashcard-wrapper">
        <div class="card" id="flashcard" onclick="flipCard()">
            <button class="btn-speak" onclick="event.stopPropagation(); playAudio();"><i class="fas fa-volume-up"></i></button>
            
            <div class="card-face card-front">
                <div class="word-wrap">
                    <div class="korean" id="front-text">안녕하세요</div>
                    <div class="roman" id="front-roman">annyeonghaseyo</div>
                </div>
                <div class="flip-icon-center"><i class="fas fa-sync-alt"></i> Lật thẻ</div>
            </div>
            <div class="card-face card-back">
                <div class="word-wrap">
                    <div class="vietnamese" id="back-text">Xin chào</div>
                    <div class="roman" id="back-roman">annyeonghaseyo</div>
                </div>
                <div class="flip-icon-center"><i class="fas fa-sync-alt"></i> Lật lại</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()"><i class="fas fa-chevron-left"></i> Trước</button>
        <button class="active-btn" onclick="flipCard()"><i class="fas fa-sync-alt"></i> Lật thẻ</button>
        <button onclick="nextCard()">Sau <i class="fas fa-chevron-right"></i></button>
    </div>

    <div class="action-buttons">
        <button id="btn-fav" onclick="toggleStatus('fav')"><i class="far fa-heart"></i> Yêu thích</button>
        <button id="btn-learnt" onclick="toggleStatus('learnt')"><i class="far fa-check-circle"></i> Đã thuộc</button>
        <button id="btn-hard" onclick="toggleStatus('hard')"><i class="fas fa-exclamation-triangle"></i> Từ khó</button>
    </div>

    <div class="progress-container">
        <span id="current-idx">1</span> / <span id="total-idx">120</span>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <!-- Chế độ Mini Game Trắc Nghiệm -->
    <div id="game-container" style="display: none;">
        <div class="game-stats">
            <span><i class="fas fa-star" style="color: #f1c40f;"></i> Điểm: <strong id="game-score">0</strong></span>
            <span><i class="fas fa-fire" style="color: #e74c3c;"></i> Chuỗi: <strong id="game-streak">0</strong></span>
        </div>
        <div class="quiz-card">
            <div class="quiz-question" id="quiz-question">안녕하세요</div>
            <div class="quiz-roman" id="quiz-roman">annyeonghaseyo</div>
            <button class="btn-quiz-speak" onclick="playQuizAudio()"><i class="fas fa-volume-up"></i> Nghe phát âm</button>
        </div>
        <div class="quiz-options" id="quiz-options"></div>
        <div id="quiz-feedback" class="quiz-feedback"></div>
    </div>

    <div class="footer">© 2026 Korean Flashcard Hub</div>

            { front: "일하다", roman: "ilhada", back: "Làm việc", fav: false, learnt: false, hard: false },
            { front: "쉬다", roman: "swida", back: "Nghỉ ngơi", fav: false, learnt: false, hard: false },
            { front: "자다", roman: "jada", back: "Ngủ", fav: false, learnt: false, hard: false },
            { front: "일어나다", roman: "ireonada", back: "Thức dậy", fav: false, learnt: false, hard: false },
            { front: "사다", roman: "sada", back: "Mua", fav: false, learnt: false, hard: false },
            { front: "팔다", roman: "palda", back: "Bán", fav: false, learnt: false, hard: false },
            { front: "만나다", roman: "mannada", back: "Gặp gỡ", fav: false, learnt: false, hard: false },
            { front: "웃다", roman: "utda", back: "Cười", fav: false, learnt: false, hard: false },
            { front: "울다", roman: "ulda", back: "Khóc", fav: false, learnt: false, hard: false },
            { front: "비싸다", roman: "bissada", back: "Đắt", fav: false, learnt: false, hard: false },
            { front: "싸다", roman: "ssada", back: "Rẻ", fav: false, learnt: false, hard: false },
            { front: "어렵다", roman: "eoryeopda", back: "Khó", fav: false, learnt: false, hard: false },
            { front: "쉽다", roman: "swipda", back: "Dễ", fav: false, learnt: false, hard: false },
            { front: "재미있다", roman: "jaemiitda", back: "Thú vị / Hay", fav: false, learnt: false, hard: false },
            { front: "재미없다", roman: "jaemieoptda", back: "Chán / Không hay", fav: false, learnt: false, hard: false },
            { front: "머리", roman: "meori", back: "Đầu / Tóc", fav: false, learnt: false, hard: false },
            { front: "손", roman: "son", back: "Bàn tay", fav: false, learnt: false, hard: false },
            { front: "발", roman: "bal", back: "Bàn chân", fav: false, learnt: false, hard: false },
            { front: "마음", roman: "maeum", back: "Tấm lòng / Tâm trí", fav: false, learnt: false, hard: false }
        ];

        let currentIndex = 0;
        const card = document.getElementById('flashcard');
        const frontText = document.getElementById('front-text');
        const backText = document.getElementById('back-text');
        const frontRoman = document.getElementById('front-roman');
        const backRoman = document.getElementById('back-roman');
        const currentIdxSpan = document.getElementById('current-idx');
        const totalIdxSpan = document.getElementById('total-idx');
        const progressFill = document.getElementById('progress-fill');

        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {};
        }

        function updateCard() {
            card.classList.remove('is-flipped');
            const currentCard = flashcards[currentIndex];
            frontText.innerText = currentCard.front;
            backText.innerText = currentCard.back;
            frontRoman.innerText = currentCard.roman;
            backRoman.innerText = currentCard.roman;

            currentIdxSpan.innerText = currentIndex + 1;
            totalIdxSpan.innerText = flashcards.length;
            progressFill.style.width = ((currentIndex + 1) / flashcards.length) * 100 + '%';

            const btnFav = document.getElementById('btn-fav');
            const btnLearnt = document.getElementById('btn-learnt');
            const btnHard = document.getElementById('btn-hard');

            btnFav.innerHTML = (currentCard.fav ? '<i class="fas fa-heart"></i>' : '<i class="far fa-heart"></i>') + ' Yêu thích';
            btnFav.className = currentCard.fav ? 'active-love' : '';
            
            btnLearnt.innerHTML = (currentCard.learnt ? '<i class="fas fa-check-circle"></i>' : '<i class="far fa-check-circle"></i>') + ' Đã thuộc';
            btnLearnt.className = currentCard.learnt ? 'active-learnt' : '';

            btnHard.innerHTML = (currentCard.hard ? '<i class="fas fa-exclamation-triangle"></i>' : '<i class="fas fa-exclamation-triangle"></i>') + ' Từ khó';
            btnHard.className = currentCard.hard ? 'active-hard' : '';
        }

        function flipCard() { card.classList.toggle('is-flipped'); }
        function prevCard() { if (currentIndex > 0) { currentIndex--; updateCard(); } else alert("Bạn đang ở thẻ đầu tiên!"); }
        function nextCard() { if (currentIndex < flashcards.length - 1) { currentIndex++; updateCard(); } else alert("Chúc mừng! Bạn đã hoàn thành tất cả từ vựng!"); }
        function toggleStatus(type) { 
            const c = flashcards[currentIndex];
            if (type === 'fav') c.fav = !c.fav; 
            if (type === 'learnt') c.learnt = !c.learnt; 
            if (type === 'hard') c.hard = !c.hard;
            updateCard(); 
        }

        function playAudio() {
            speakText(flashcards[currentIndex].front);
        }

        function speakText(text) {
            if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 0.75;
                const voices = window.speechSynthesis.getVoices();
                const koVoice = voices.find(voice => voice.lang === 'ko-KR');
                if (koVoice) utterance.voice = koVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        function cleanString(str) {
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().trim();
        }

        function isMatch(cardItem, queryRaw) {
            const queryClean = cleanString(queryRaw);
            const queryOriginal = queryRaw.toLowerCase().trim();
            return cardItem.front.toLowerCase().includes(queryOriginal) ||
                   cardItem.back.toLowerCase().includes(queryOriginal) ||
                   cleanString(cardItem.front).includes(queryClean) ||
                   cleanString(cardItem.back).includes(queryClean) ||
                   cleanString(cardItem.roman).includes(queryClean);
        }

        function searchWord() {
            const inputVal = document.getElementById('search-input').value;
            if (!inputVal.trim()) return;

            let foundIndex = -1;
            for (let i = currentIndex + 1; i < flashcards.length; i++) {
                if (isMatch(flashcards[i], inputVal)) { foundIndex = i; break; }
            }
            if (foundIndex === -1) {
                for (let i = 0; i <= currentIndex; i++) {
                    if (isMatch(flashcards[i], inputVal)) { foundIndex = i; break; }
                }
            }
            if (foundIndex !== -1) {
                currentIndex = foundIndex;
                updateCard();
            } else {
                alert("Không tìm thấy từ vựng phù hợp!");
            }
        }

        // --- MINI GAME LOGIC ---
        let gameScore = 0;
        let gameStreak = 0;
        let currentQuizWord = null;
        let canAnswer = true;

        function switchMode(mode) {
            const flashcardElems = [
                document.querySelector('.search-container'),
                document.querySelector('.flashcard-wrapper'),
                document.querySelector('.controls'),
                document.querySelector('.action-buttons'),
                document.querySelector('.progress-container')
            ];
            const gameElem = document.getElementById('game-container');
            const btnFlashcard = document.getElementById('mode-flashcard');
            const btnGame = document.getElementById('mode-game');

            if (mode === 'flashcard') {
                flashcardElems.forEach(el => el.style.display = '');
                gameElem.style.display = 'none';
                btnFlashcard.classList.add('active-mode');
                btnGame.classList.remove('active-mode');
            } else {
                flashcardElems.forEach(el => el.style.display = 'none');
                gameElem.style.display = 'block';
                btnGame.classList.add('active-mode');
                btnFlashcard.classList.remove('active-mode');
                startNewQuiz();
            }
        }

        function startNewQuiz() {
            canAnswer = true;
            document.getElementById('quiz-feedback').innerHTML = '';
            
            const randIdx = Math.floor(Math.random() * flashcards.length);
            currentQuizWord = flashcards[randIdx];

            document.getElementById('quiz-question').innerText = currentQuizWord.front;
            document.getElementById('quiz-roman').innerText = currentQuizWord.roman;

            const options = [currentQuizWord.back];
            while (options.length < 4) {
                const randomOpt = flashcards[Math.floor(Math.random() * flashcards.length)].back;
                if (!options.includes(randomOpt)) {
                    options.push(randomOpt);
                }
            }

            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            options.forEach(optText => {
                const btn = document.createElement('button');
                btn.className = 'quiz-opt-btn';
                btn.innerText = optText;
                btn.onclick = () => checkQuizAnswer(optText, btn);
                optionsContainer.appendChild(btn);
            });
            
            playQuizAudio();
        }

        function checkQuizAnswer(selectedOpt, btnElement) {
            if (!canAnswer) return;
            canAnswer = false;

            const allBtns = document.querySelectorAll('.quiz-opt-btn');
            if (selectedOpt === currentQuizWord.back) {
                btnElement.classList.add('correct');
                gameScore += 10;
                gameStreak++;
                document.getElementById('quiz-feedback').innerHTML = '<span style="color: #2e7d32;"><i class="fas fa-check-circle"></i> Chính xác! (+10 điểm)</span>';
            } else {
                btnElement.classList.add('wrong');
                gameStreak = 0;
                allBtns.forEach(b => {
                    if (b.innerText === currentQuizWord.back) b.classList.add('correct');
                });
                document.getElementById('quiz-feedback').innerHTML = '<span style="color: #c0392b;"><i class="fas fa-times-circle"></i> Sai rồi! Đáp án: ' + currentQuizWord.back + '</span>';
            }

            document.getElementById('game-score').innerText = gameScore;
            document.getElementById('game-streak').innerText = gameStreak;

            setTimeout(() => {
                startNewQuiz();
            }, 1500);
        }

        function playQuizAudio() {
            if (currentQuizWord) {
                speakText(currentQuizWord.front);
            }
        }

        updateCard();
    </script>
</body>
</html>
