<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Học Tiếng Anh - Flashcard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <h1>📚 English Flashcards</h1>
      <div class="nav-buttons">
        <button id="nav-study" class="nav-btn">📖 Học</button>
        <button id="nav-quiz" class="nav-btn">❓ Quiz</button>
        <button id="nav-manage" class="nav-btn">⚙️ Quản lý</button>
      </div>
      <button id="btn-toggle-sidebar" class="icon-btn">☰</button>
    </header>

    <div class="main-container">
      <!-- Sidebar danh sách bộ thẻ -->
      <aside id="sidebar">
        <div class="sidebar-header">
          <h2>📂 Bộ thẻ</h2>
          <button id="btn-add-deck" class="btn-primary">+ Thêm mới</button>
        </div>
        <ul id="deck-list"></ul>
        <div class="sidebar-footer">
          <button id="btn-import" class="btn-secondary">📥 Nhập JSON</button>
          <button id="btn-export" class="btn-secondary">📤 Xuất JSON</button>
        </div>
      </aside>

      <!-- Vùng nội dung chính -->
      <main id="main-content">
        <!-- View Học tập -->
        <div id="study-view" class="view active">
          <div class="study-controls">
            <select id="study-deck-select">
              <option value="">-- Chọn bộ thẻ --</option>
            </select>
            <div class="direction-btns">
              <button id="btn-direction-en-vi" class="btn-option active">Anh → Việt</button>
              <button id="btn-direction-vi-en" class="btn-option">Việt → Anh</button>
            </div>
            <button id="btn-start-study" class="btn-primary">Bắt đầu học</button>
          </div>

          <div id="study-area" style="display: none;">
            <div class="progress-bar">
              <div class="progress-fill" id="study-progress-fill"></div>
              <span id="study-progress-text">0/0</span>
            </div>

            <div class="flashcard-container" id="flashcard">
              <div class="flashcard-inner">
                <div class="flashcard-front">
                  <p id="card-front-text"></p>
                  <button id="btn-speak-front" class="speak-btn" title="Phát âm">🔊</button>
                </div>
                <div class="flashcard-back">
                  <p id="card-back-text"></p>
                  <p id="card-example" class="example"></p>
                  <img id="card-image" src="" alt="" style="max-width: 200px; display: none;">
                  <button id="btn-speak-back" class="speak-btn" title="Phát âm">🔊</button>
                </div>
              </div>
            </div>

            <div class="rating-buttons" id="rating-buttons" style="display: none;">
              <button class="rating-btn again" data-rating="1">🔄 Again</button>
              <button class="rating-btn hard" data-rating="2">🤔 Hard</button>
              <button class="rating-btn good" data-rating="3">👍 Good</button>
              <button class="rating-btn easy" data-rating="4">🌟 Easy</button>
            </div>
          </div>
        </div>

        <!-- View Kiểm tra -->
        <div id="quiz-view" class="view">
          <div class="quiz-controls">
            <select id="quiz-deck-select">
              <option value="">-- Chọn bộ thẻ --</option>
            </select>
            <button id="btn-start-quiz" class="btn-primary">Bắt đầu Quiz</button>
          </div>

          <div id="quiz-area" style="display: none;">
            <div class="quiz-progress">
              <span id="quiz-progress-text">Câu 1/10</span>
              <span id="quiz-score">Điểm: 0</span>
            </div>
            <div class="quiz-question" id="quiz-question"></div>
            <div class="quiz-options" id="quiz-options"></div>
            <button id="btn-next-question" class="btn-primary" style="display:none;">Câu tiếp theo</button>
          </div>
        </div>

        <!-- View Quản lý thẻ -->
        <div id="manage-view" class="view">
          <div class="manage-controls">
            <select id="manage-deck-select">
              <option value="">-- Chọn bộ thẻ --</option>
            </select>
            <button id="btn-add-card" class="btn-primary">+ Thêm thẻ</button>
            <button id="btn-edit-deck-name" class="btn-secondary">✏️ Đổi tên bộ</button>
            <button id="btn-delete-deck" class="btn-danger">🗑️ Xoá bộ</button>
          </div>
          <div id="cards-container" class="cards-grid"></div>
        </div>
      </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close-modal">&times;</span>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- Templates -->
    <template id="deck-form-template">
      <h3>Thêm / Sửa bộ thẻ</h3>
      <input type="text" id="deck-name-input" placeholder="Tên bộ thẻ" required>
      <button id="btn-save-deck" class="btn-primary">Lưu</button>
    </template>

    <template id="card-form-template">
      <h3>Thêm / Sửa thẻ</h3>
      <input type="text" id="card-front-input" placeholder="Từ vựng (mặt trước)" required>
      <input type="text" id="card-back-input" placeholder="Nghĩa (mặt sau)" required>
      <input type="text" id="card-example-input" placeholder="Ví dụ (tuỳ chọn)">
      <input type="url" id="card-image-input" placeholder="URL ảnh minh hoạ (tuỳ chọn)">
      <button id="btn-save-card" class="btn-primary">Lưu</button>
    </template>

    <template id="import-template">
      <h3>Nhập dữ liệu JSON</h3>
      <textarea id="import-json" rows="10" placeholder='Dán nội dung JSON vào đây...'></textarea>
      <button id="btn-do-import" class="btn-primary">Nhập</button>
    </template>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/study.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
