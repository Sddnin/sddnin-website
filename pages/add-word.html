<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm từ vựng - Korean Flashcard Hub</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/animation.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
    <header class="main-header">
        <div class="logo"><h1>🇰🇷 Thêm từ vựng</h1></div>
        <nav class="main-nav">
            <ul>
                <li><a href="home.html">Trang chủ</a></li>
                <li><a href="flashcard.html">Flashcard</a></li>
                <li><a href="review.html">Ôn tập</a></li>
                <li><a href="quiz.html">Quiz</a></li>
                <li><a href="hanja.html">Hanja</a></li>
                <li><a href="grammar.html">Ngữ pháp</a></li>
                <li><a href="add-word.html" class="active">Thêm từ</a></li>
                <li><a href="stats.html">Thống kê</a></li>
            </ul>
        </nav>
        <button id="theme-toggle" class="theme-btn">🌙</button>
    </header>

    <main style="max-width:600px;margin:20px auto;padding:20px;">
        <h2>Thêm từ vựng mới</h2>
        <form id="add-word-form" style="display:flex;flex-direction:column;gap:10px;">
            <input type="text" id="korean" placeholder="Từ tiếng Hàn" required>
            <input type="text" id="romanization" placeholder="Phiên âm">
            <input type="text" id="meaning" placeholder="Nghĩa tiếng Việt" required>
            <input type="text" id="example" placeholder="Ví dụ (tuỳ chọn)">
            <select id="level">
                <option value="TOPIK 1">TOPIK 1</option>
                <option value="TOPIK 2">TOPIK 2</option>
                <option value="TOPIK 3">TOPIK 3</option>
            </select>
            <button type="submit" class="cta-button">Thêm từ</button>
        </form>

        <h3>Từ đã thêm</h3>
        <div id="custom-word-list"></div>

        <hr>
        <h3>Xuất/Nhập dữ liệu</h3>
        <button id="export-btn" class="cta-button">📤 Xuất JSON</button>
        <br><br>
        <input type="file" id="import-file" accept=".json">
        <button id="import-btn" class="cta-button">📥 Nhập JSON</button>
    </main>

    <footer class="main-footer"><p>&copy; 2024 Korean Flashcard Hub</p></footer>

    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/add-word.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
