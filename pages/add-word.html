<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm từ vựng - Korean Flashcard Hub</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/animation.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
    <header class="main-header">...</header>
    <main>
        <h2>Thêm từ vựng mới</h2>
        <form id="add-word-form">
            <input type="text" id="korean" placeholder="Từ tiếng Hàn" required>
            <input type="text" id="romanization" placeholder="Phiên âm">
            <input type="text" id="meaning" placeholder="Nghĩa" required>
            <input type="text" id="example" placeholder="Ví dụ">
            <select id="level"><option value="TOPIK 1">TOPIK 1</option><option value="TOPIK 2">TOPIK 2</option></select>
            <button type="submit">Thêm từ</button>
        </form>
        <div id="custom-word-list"></div>
        <button id="export-btn">📤 Xuất dữ liệu</button>
        <input type="file" id="import-file" accept=".json">
        <button id="import-btn">📥 Nhập dữ liệu</button>
    </main>
    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/add-word.js"></script>
</body>
</html>
