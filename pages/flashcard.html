<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard - Korean Flashcard Hub</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/flashcard.css">
    <link rel="stylesheet" href="../assets/css/animation.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
    <header class="main-header">
        <div class="logo"><h1>🇰🇷 Flashcard</h1></div>
        <nav class="main-nav">
            <ul>
                <li><a href="home.html">Trang chủ</a></li>
                <li><a href="flashcard.html" class="active">Flashcard</a></li>
                <li><a href="review.html">Ôn tập</a></li>
                <li><a href="quiz.html">Quiz</a></li>
                <li><a href="hanja.html">Hanja</a></li>
                <li><a href="grammar.html">Ngữ pháp</a></li>
                <li><a href="add-word.html">Thêm từ</a></li>
                <li><a href="stats.html">Thống kê</a></li>
            </ul>
        </nav>
        <button id="theme-toggle" class="theme-btn">🌙</button>
    </header>

    <main class="flashcard-main">
        <div class="filter-bar" style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
            <select id="topik-select">
                <option value="all">Tất cả TOPIK</option>
                <option value="TOPIK 1">TOPIK 1</option>
                <option value="TOPIK 2">TOPIK 2</option>
                <option value="TOPIK 3">TOPIK 3</option>
            </select>
            <button id="mode-toggle" class="control-btn">📚 Học</button>
            <button id="voice-flip-btn" class="control-btn">🎤 Voice Flip</button>
        </div>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Tìm kiếm từ vựng..." class="search-input">
            <button id="search-btn" class="search-btn">🔍</button>
        </div>

        <div class="flashcard-container">
            <div class="flashcard" id="flashcard">
                <div class="flashcard-inner">
                    <div class="flashcard-front">
                        <span class="card-text" id="front-text">안녕하세요</span>
                        <button class="pronounce-btn" id="pronounce-btn">🔊</button>
                    </div>
                    <div class="flashcard-back">
                        <span class="card-text" id="back-text">Xin chào</span>
                        <span class="card-romanization" id="romanization-text">annyeonghaseyo</span>
                        <span class="card-example" id="example-text">안녕하세요, 반갑습니다.</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="flashcard-controls">
            <button id="prev-btn" class="control-btn">⬅ Trước</button>
            <button id="flip-btn" class="control-btn flip-btn">🔄 Lật thẻ</button>
            <button id="next-btn" class="control-btn">Sau ➡</button>
            <button id="shuffle-btn" class="control-btn">🔀 Xáo trộn</button>
        </div>

        <div class="flashcard-actions">
            <button id="favorite-btn" class="action-btn">🤍 Yêu thích</button>
            <button id="known-btn" class="action-btn">☐ Đã thuộc</button>
            <button id="difficult-btn" class="action-btn">⚠️ Từ khó</button>
        </div>

        <div class="progress-container">
            <span id="card-counter">1 / 20</span>
            <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        </div>
    </main>

    <footer class="main-footer"><p>&copy; 2024 Korean Flashcard Hub</p></footer>

    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/srs.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/flashcard.js"></script>
    <script src="../assets/js/search.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
