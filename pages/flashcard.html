<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard 2.0 - Học Từ Vựng Hàn Quốc</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/flashcard.css">
</head>
<body>
    <header class="navbar">
        <a href="../index.html" class="logo">SDDNIN 2.0</a>
        <div class="user-stats">
            <span id="user-streak">🔥 0 ngày</span>
            <span id="user-learned-count">✅ 0 từ</span>
        </div>
    </header>

    <main class="flashcard-container">
        <!-- Controls Bar -->
        <div class="toolbar">
            <select id="filter-select">
                <option value="all">Tất cả từ vựng</option>
                <option value="unlearned">Chưa thuộc</option>
                <option value="learned">Đã thuộc</option>
                <option value="bookmarked">Đã đánh dấu</option>
            </select>
            <button id="shuffle-btn" class="btn-secondary">🔀 Xáo trộn</button>
        </div>

        <!-- Flashcard UI -->
        <div id="flashcard" class="card">
            <div class="card-face card-front">
                <span id="korean-text" class="korean-word">안녕하세요</span>
                <span id="romanization-text" class="romanization">[annyeonghaseyo]</span>
                <button id="audio-btn" class="no-flip btn-icon">🔊 Phát âm</button>
            </div>
            <div class="card-face card-back">
                <p id="meaning-text" class="meaning">Xin chào</p>
                <p id="example-text" class="example">안녕하세요, 반갑습니다.</p>
            </div>
        </div>

        <!-- Card Action Controls -->
        <div class="controls">
            <button id="prev-btn" class="btn">⬅️ Từ trước</button>
            <span id="card-counter">1 / 60</span>
            <button id="master-btn" class="btn-success no-flip">Đánh dấu thuộc</button>
            <button id="next-btn" class="btn">Từ tiếp ➡️</button>
        </div>
    </main>

    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/flashcard.js"></script>
</body>
</html>
