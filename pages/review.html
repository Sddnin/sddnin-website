<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập - Korean Flashcard Hub</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/flashcard.css">
    <link rel="stylesheet" href="../assets/css/animation.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <h1>🇰🇷 Ôn tập</h1>
        </div>
        <nav class="main-nav">
            <ul>
                <li><a href="home.html">Trang chủ</a></li>
                <li><a href="flashcard.html">Flashcard</a></li>
                <li><a href="review.html" class="active">Ôn tập</a></li>
                <li><a href="hanja.html">Hanja</a></li>
                <li><a href="grammar.html">Ngữ pháp</a></li>
            </ul>
        </nav>
        <button id="theme-toggle" class="theme-btn">🌙</button>
    </header>

    <main class="review-main">
        <div class="review-tabs">
            <button class="tab-btn active" data-tab="difficult">Từ khó</button>
            <button class="tab-btn" data-tab="unlearned">Chưa thuộc</button>
            <button class="tab-btn" data-tab="learned">Đã học</button>
            <button class="tab-btn" data-tab="all">Tất cả</button>
        </div>

        <div class="review-container" id="review-container">
            <!-- Danh sách từ vựng sẽ được tạo động -->
        </div>

        <div class="review-stats">
            <div class="stat-box">
                <span class="stat-value" id="total-words">0</span>
                <span class="stat-label">Tổng số từ</span>
            </div>
            <div class="stat-box">
                <span class="stat-value" id="learned-words">0</span>
                <span class="stat-label">Đã thuộc</span>
            </div>
            <div class="stat-box">
                <span class="stat-value" id="difficult-words">0</span>
                <span class="stat-label">Từ khó</span>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2024 Korean Flashcard Hub</p>
    </footer>

    <script src="../assets/js/storage.js"></script>
    <script src="../assets/js/theme.js"></script>
    <script src="../assets/js/review.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
